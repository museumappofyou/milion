# P15, Milestone XIX: 1453 in 53 days (TM, SB). A map sequence, labelled
# RECONSTRUCTION; every event carries the accounts that tell it, attributed.
# Built by tool/siege/build_siege.py into assets/siege/1453/siege.json.
# Dates are the sources' own (Julian). Day 1 is 6 April, the conventional
# start; 29 May is day 54, 53 days on. Positions off the wall line were
# taken from the strip's line (assets/walls/land-walls/strip.json) at the
# chainage named in each note; none is surveyed.
id: '1453'
place: land-walls
milestone: milestone-xix
honesty: RECONSTRUCTION
title:
  en: 1453 in 53 days
  tr: 53 günde 1453
description:
  en: >-
    The siege of Constantinople from 6 April to 29 May 1453, as a map. Each
    event lists who tells it: Byzantine, Venetian, Genoese, Ottoman-side and
    modern accounts, which often disagree, and the map says so. Where an event
    stands is a reconstruction; a dashed mark means its place is a guess.
    Dates are the sources’ own, in the Julian calendar.
  tr: >-
    6 Nisan–29 Mayıs 1453 İstanbul kuşatması bir harita olarak. Her olayın
    yanında onu kimin anlattığı yazar: Bizans, Venedik, Ceneviz, Osmanlı
    tarafı ve modern anlatılar sık sık birbirini tutmaz; harita bunu da
    söyler. Olayların yeri bir yeniden kurgudur; kesikli bir işaret, yerin
    tahmin olduğunu gösterir. Tarihler kaynakların kendi tarihleridir, Jülyen
    takvimiyle.
talkback:
  en: >-
    A map of the siege of 1453, day by day. Drag to move the map, pinch to
    zoom. The day scale below picks a day. The actions menu has next event,
    previous event and play. Accounts lists who tells each event.
  tr: >-
    1453 kuşatmasının gün gün haritası. Haritayı sürükleyerek kaydırın,
    iki parmakla yakınlaştırın. Alttaki gün ölçeği bir gün seçer. Eylemler
    menüsünde sonraki olay, önceki olay ve oynat var. Anlatılar, her olayı
    kimin anlattığını listeler.
sources: [barbaro-1856, doukas-magoulias-1975, pears-1903, van-millingen-1899,
          wp-fall-of-constantinople-1386410654]
firstDay: '1453-04-06'
lastDay: '1453-05-29'
days: 54
frame: {south: 40.93, west: 28.895, north: 41.125, east: 29.095}
home: {lat: 41.022, lng: 28.955, width: 9000}
# Names written on the map; the Atlas's base carries none.
labels:
  - {lat: 41.0035, lng: 28.944, water: false, text: {en: Constantinople, tr: Konstantinopolis}}
  - {lat: 41.0268, lng: 28.9752, water: false, text: {en: Galata, tr: Galata}}
  - {lat: 41.0302, lng: 28.9555, water: true, text: {en: Golden Horn, tr: Haliç}}
  - {lat: 40.996, lng: 28.962, water: true, text: {en: Sea of Marmara, tr: Marmara Denizi}}
  - {lat: 41.034, lng: 29.012, water: true, text: {en: Bosphorus, tr: Boğaziçi}}
  - {lat: 41.0775, lng: 29.069, water: false, text: {en: Anadolu Hisarı, tr: Anadolu Hisarı}}

events:
  - id: rumeli-hisari
    kind: fort
    day: 1
    shape: {feature: rumeli-hisari-1452}
    certainty: surviving
    label: {en: 'Rumeli Hisarı, 1452', tr: 'Rumeli Hisarı, 1452'}
    note:
      en: >-
        Built by Mehmed II on the European shore of the Bosphorus’s narrows from
        the spring to August 1452, in about four months.
      tr: >-
        II. Mehmed’in 1452 baharından Ağustos’una, yaklaşık dört ayda,
        Boğaz’ın en dar yerinde Avrupa yakasına yaptırdığı hisar.
    accounts:
      - who: {en: 'Doukas, Byzantine historian, not in the city', tr: 'Dukas, Bizanslı tarihçi, şehirde değildi'}
        side: byzantine
        says:
          en: >-
            Finished in four months, with bronze guns in the tower of Halil
            Pasha and four hundred young men as its garrison. That winter its
            guns sank a Venetian ship under Rizzo that would not lower sail,
            and he saw the crew’s bodies a few days later.
          tr: >-
            Dört ayda bitirildi; Halil Paşa kulesinde tunç toplar, garnizonda
            dört yüz genç vardı. O kış topları, yelken indirmeyen Rizzo’nun
            Venedik gemisini batırdı; mürettebatın cesetlerini birkaç gün sonra
            gördüğünü yazar.
        sources: [doukas-magoulias-1975]
      - who: {en: Ministry of Culture and Tourism, tr: Kültür ve Turizm Bakanlığı}
        side: modern
        says:
          en: Begun in March 1452 and finished in August of the same year.
          tr: Mart 1452’de başlandı, aynı yılın Ağustos’unda bitirildi.
        sources: [ktb-rumeli-hisari]
    sources: [doukas-magoulias-1975, ktb-rumeli-hisari, wp-rumelihisari-1369216085]
  - id: chain
    kind: chain
    day: 1
    # From the Golden Horn wall at Yalıköşkü (the Gate of Eugenius; the point
    # on the Atlas's golden-horn-walls nearest it) to the end of the Atlas's
    # Galata wall at the shore.
    shape: [[41.01678, 28.9785], [41.0238, 28.9788]]
    certainty: approximate
    label: {en: The chain, tr: Zincir}
    note:
      en: >-
        A boom of great timbers joined with iron, across the mouth of the
        Golden Horn from the city to a tower of Galata’s walls, from 2 April.
        Where its southern end was made fast is told two ways.
      tr: >-
        2 Nisan’dan itibaren Haliç’in ağzına, şehirden Galata surlarının bir
        kulesine kadar gerilen, demirle birbirine bağlı kalın kütüklerden bir
        engel. Güney ucunun nereye bağlandığı iki türlü anlatılır.
    accounts:
      - who: {en: 'Nicolò Barbaro, Venetian, in the city (diary)', tr: 'Nicolò Barbaro, Venedikli, şehirdeydi (günlük)'}
        side: venetian
        says:
          en: >-
            On 2 April the emperor ordered Bartolomeo Soligo to stretch the
            chain across the harbour from Constantinople to Pera: very thick
            round timbers joined with iron, one end inside each city’s walls.
          tr: >-
            2 Nisan’da imparator, Bartolomeo Soligo’ya zinciri limanın
            karşısına, Konstantinopolis’ten Pera’ya germesini emretti: demirle
            birleştirilmiş çok kalın yuvarlak kütükler; bir ucu iki şehrin de
            surlarının içindeydi.
        sources: [barbaro-1856]
      - who: {en: 'Kritoboulos, Greek in Mehmed’s service, writing for him', tr: 'Kritobulos, Mehmed’in hizmetindeki Rum, onun için yazdı'}
        side: ottomanGreek
        says:
          en: >-
            They closed the great harbour and the whole Horn with chains, from
            the dockyards of Galata to the Gate of Eugenius, where it is
            narrowest.
          tr: >-
            Büyük limanı ve bütün Haliç’i, Galata tersanelerinden Eugenios
            Kapısı’na, en dar olduğu yere kadar zincirlerle kapattılar.
        sources: [kritoboulos-muller-1870]
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: Its southern end was at the Horaia, the Beautiful Gate.
          tr: Güney ucu Horaia, yani Güzel Kapı’daydı.
        sources: [van-millingen-1899]
    sources: [barbaro-1856, kritoboulos-muller-1870, van-millingen-1899]
  - id: camp
    kind: camp
    day: 1
    # 900 m outside the wall at chainage 4,300 m (the Lycus valley).
    shape: [[41.0298, 28.921279]]
    certainty: conjectural
    label: {en: The Ottoman camp, tr: Osmanlı ordugâhı}
    note:
      en: >-
        The army camped along the whole land front. The mark is only where the
        accounts point; the camp has no surveyed place.
      tr: >-
        Ordu kara surlarının bütün önü boyunca konakladı. İşaret yalnızca
        anlatıların gösterdiği yönü belirtir; ordugâhın ölçülmüş bir yeri
        yoktur.
    accounts:
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            Mehmed pitched his tents opposite the Gate of Charisius and laid
            siege to the city on the Friday after Easter, 6 April.
          tr: >-
            Mehmed çadırlarını Kharisios Kapısı’nın karşısına kurdu ve
            Paskalya’dan sonraki cuma, 6 Nisan’da şehri kuşattı.
        sources: [doukas-magoulias-1975]
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            On 3 April the camp was two and a half miles off, about 160,000
            Turks; on 6 April one mile; on 7 April a quarter of a mile, all
            along the six miles of the land walls.
          tr: >-
            3 Nisan’da ordugâh iki buçuk mil uzaktaydı, yaklaşık 160.000 Türk;
            6 Nisan’da bir mil; 7 Nisan’da çeyrek mil, kara surlarının altı
            millik boyu boyunca.
        sources: [barbaro-1856]
      - who: {en: Kritoboulos, tr: Kritobulos}
        side: ottomanGreek
        says:
          en: >-
            Mehmed set his three largest and strongest guns against the
            Mesoteichion, where he had his camp and his own tent.
          tr: >-
            Mehmed en büyük ve en güçlü üç topunu, ordugâhının ve kendi
            çadırının bulunduğu Mesoteikhion’un karşısına kurdurdu.
        sources: [kritoboulos-muller-1870]
      - who: {en: 'Edwin Pears, historian, 1903', tr: 'Edwin Pears, tarihçi, 1903'}
        side: modern
        says:
          en: >-
            The contemporaries’ numbers run from 160,000 to over 400,000; an
            Ottoman chronicler gives no more than 80,000. Modern historians put
            the army far lower than the witnesses did.
          tr: >-
            Çağdaşların verdiği sayılar 160.000 ile 400.000’in üstü arasında
            değişir; bir Osmanlı kronikçisi 80.000’den fazla demez. Modern
            tarihçiler orduyu tanıkların söylediğinden çok daha küçük sayar.
        sources: [pears-1903, wp-fall-of-constantinople-1386410654]
    sources: [doukas-magoulias-1975, barbaro-1856, kritoboulos-muller-1870, pears-1903]
  - id: great-gun
    kind: gun
    day: 1
    until: 54
    # About 250 m outside the Gate of St Romanus (chainage 3,891 m), aimed at it.
    shape: [[41.0226, 28.9233], [41.02167, 28.926249]]
    certainty: approximate
    label: {en: Orban’s great gun, tr: Orban’ın büyük topu}
    note:
      en: >-
        A bronze bombard cast at Edirne by a Hungarian founder, Orban (Urban).
        Its figures are in old units and vary; the metric ones often quoted
        are conversions.
      tr: >-
        Macar bir dökümcü, Orban (Urban) tarafından Edirne’de dökülen tunç bir
        bombarda. Ölçüleri eski birimlerle verilir ve kaynaktan kaynağa
        değişir; sık anılan metrik değerler çevirmedir.
    accounts:
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            A Hungarian founder, unpaid by the emperor, went over to Mehmed and
            cast it in three months; it was tried at Edirne in January. Sixty
            oxen and four hundred men brought it through February and March,
            and it was set opposite the wall near the Gate of St Romanus.
          tr: >-
            İmparatordan parasını alamayan Macar bir dökümcü Mehmed’e geçti ve
            topu üç ayda döktü; Ocak’ta Edirne’de denendi. Altmış öküz ve dört
            yüz adam onu Şubat ve Mart boyunca getirdi; Romanos Kapısı’nın
            yanındaki surun karşısına kuruldu.
        sources: [doukas-magoulias-1975]
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            Four bombards stood at the Gate of St Romanus, the weakest gate of
            the city; the largest threw a stone of 1,200 pounds.
          tr: >-
            Şehrin en zayıf kapısı Romanos Kapısı’nda dört bombarda vardı; en
            büyüğü 1.200 libbrelik taş atıyordu.
        sources: [barbaro-1856]
      - who: {en: Kritoboulos, tr: Kritobulos}
        side: ottomanGreek
        says:
          en: >-
            Tells how a giant bronze gun was cast in clay moulds from some
            1,500 talents of bronze and tin, melted for three days and nights,
            and gives its barrel as forty spans, about 8 m. He does not name
            its founder.
          tr: >-
            Dev bir tunç topun, yaklaşık 1.500 talanton tunç ve kalaydan,
            üç gün üç gece eritilerek kil kalıplara nasıl döküldüğünü anlatır;
            namlusunu kırk karış, yaklaşık 8 m verir. Dökümcünün adını
            anmaz.
        sources: [kritoboulos-muller-1870, pears-1903]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            Leonard of Chios puts it first at the Kaligaria. Some later
            accounts say it burst and killed its founder; the witnesses read
            here do not.
          tr: >-
            Sakızlı Leonardo onu önce Kaligaria’ya koyar. Bazı sonraki
            anlatılar topun patlayıp dökümcüsünü öldürdüğünü söyler; burada
            okunan tanıklar bunu söylemez.
        sources: [pears-1903]
    sources: [doukas-magoulias-1975, barbaro-1856, kritoboulos-muller-1870, pears-1903]
  - id: fleet-columns
    kind: fleet
    day: 7
    # Near today's Dolmabahçe–Beşiktaş; where the Double Columns stood is argued.
    shape: [[41.0392, 29.0005], [41.0405, 29.0035]]
    certainty: approximate
    label: {en: The fleet at the Double Columns, tr: Donanma Çifte Sütunlar’da}
    note:
      en: >-
        The Ottoman fleet under Baltaoğlu Süleyman anchored on the Bosphorus at
        the Double Columns, near today’s Dolmabahçe or Beşiktaş, on 12 April.
      tr: >-
        Baltaoğlu Süleyman komutasındaki Osmanlı donanması 12 Nisan’da Boğaz’da,
        bugünkü Dolmabahçe ya da Beşiktaş yakınındaki Çifte Sütunlar’a demirledi.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            145 sails, twelve of them full galleys, anchored at a place called
            the Columns, two miles from Constantinople.
          tr: >-
            On ikisi tam kadırga olmak üzere 145 yelkenli, Konstantinopolis’e
            iki mil uzaklıkta, Sütunlar denen yere demirledi.
        sources: [barbaro-1856]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            The counts differ: Doukas 300, Kritoboulos 350, Leonard 250, a later
            chronicle 480; Barbaro and the Florentine Tetaldi are close to each
            other.
          tr: >-
            Sayılar farklıdır: Dukas 300, Kritobulos 350, Leonardo 250, sonraki
            bir kronik 480; Barbaro ile Floransalı Tetaldi birbirine yakındır.
        sources: [pears-1903]
    sources: [barbaro-1856, pears-1903]
  - id: assault-18-april
    kind: assault
    day: 13
    until: 13
    # From 300 m outside the wall to the wall, at chainage 4,300 m.
    shape: [[41.026254, 28.926686], [41.024481, 28.92939]]
    certainty: approximate
    label: {en: The first assault, tr: İlk saldırı}
    note:
      en: The first general assault on the land walls, by night, in the Lycus valley. It failed.
      tr: Kara surlarına ilk genel saldırı; gece, Likos vadisinde. Başarısız oldu.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            Two hours after dark a great multitude of Turks came to the walls
            and fought until the sixth hour of the night; many Turks were
            killed.
          tr: >-
            Hava karardıktan iki saat sonra büyük bir Türk kalabalığı surlara
            geldi ve gecenin altıncı saatine kadar savaştı; çok Türk öldü.
        sources: [barbaro-1856]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            By then the guns had broken part of the outer wall and two towers of
            the inner wall in the Lycus valley, and Giustiniani had built a
            stockade in the gap.
          tr: >-
            O zamana kadar toplar Likos vadisinde dış surun bir kısmını ve iç
            surun iki kulesini yıkmıştı; Giustiniani gediğe bir şarampole
            kurmuştu.
        sources: [pears-1903]
    sources: [barbaro-1856, pears-1903]
  - id: four-ships
    kind: fleet
    day: 15
    until: 15
    shape: [[41.0035, 28.9935], [41.0105, 28.9905], [41.0172, 28.984]]
    certainty: conjectural
    label: {en: Four ships break through, tr: Dört gemi geçiyor}
    note:
      en: >-
        Christian ships with grain and arms fought through the whole Ottoman
        fleet into the Golden Horn. Their track is drawn only to show the
        direction.
      tr: >-
        Tahıl ve silah taşıyan Hristiyan gemileri bütün Osmanlı donanmasını
        yarıp Haliç’e girdi. İzleri yalnızca yönü göstermek için çizildi.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            Four great ships, from Genoa it was believed, were becalmed off the
            city, attacked by the whole Turkish fleet, and got through.
          tr: >-
            Cenova’dan geldiği sanılan dört büyük gemi şehrin önünde rüzgârsız
            kaldı, bütün Türk donanmasının saldırısına uğradı ve geçti.
        sources: [barbaro-1856]
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            Five ships. Mehmed spurred his horse into the sea toward them; his
            admiral Balta was beaten for the failure.
          tr: >-
            Beş gemi. Mehmed atını denize, gemilere doğru sürdü; amirali Balta
            başarısızlık yüzünden dövüldü.
        sources: [doukas-magoulias-1975]
    sources: [barbaro-1856, doukas-magoulias-1975, pears-1903]
  - id: ships-overland
    kind: overland
    photo: walls-tavernier-1455
    day: 17
    shape: {feature: siege-ships}
    certainty: conjectural
    label: {en: Ships over the hill, tr: Karadan yürütülen gemiler}
    note:
      en: >-
        About seventy light ships were hauled on greased rollers over the hill
        behind Galata and launched into the Golden Horn, around the chain. No
        witness describes the route; this line is one reading of it.
      tr: >-
        Yetmiş kadar hafif gemi, yağlanmış kızaklar üstünde Galata’nın
        arkasındaki tepeden aşırılıp zincirin gerisinden Haliç’e indirildi.
        Hiçbir tanık güzergâhı tarif etmez; bu çizgi okumalardan biridir.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            On 22 April the sultan had the whole hill above Pera levelled, from
            the shore at the Columns into the harbour, three miles, on rollers
            well greased with tallow; 72 ships.
          tr: >-
            22 Nisan’da sultan, Pera’nın üstündeki bütün tepeyi, Sütunlar’daki
            kıyıdan limanın içine kadar, üç mil boyunca düzletti; kızaklar iç
            yağıyla iyice yağlanmıştı; 72 gemi.
        sources: [barbaro-1856]
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            A road was levelled behind Galata, from below the Double Columns to
            the shore facing Kosmidion. The biremes went on wheeled cradles with
            sails set, drummers and trumpeters aboard: eighty of them.
          tr: >-
            Galata’nın arkasında, Çifte Sütunlar’ın altından Kosmidion’un
            karşısındaki kıyıya bir yol düzlendi. Biremler tekerlekli kızaklarda,
            yelkenleri açık, davulcu ve borazancılarla gitti: seksen tane.
        sources: [doukas-magoulias-1975]
      - who: {en: Kritoboulos, tr: Kritobulos}
        side: ottomanGreek
        says:
          en: >-
            From the place called the Double Column, about eight stadia, steeply
            uphill for more than half the way; the crews sat aboard with sails
            spread, and 67 ships were launched into the bay called Cold Waters,
            a little beyond Galata.
          tr: >-
            Çifte Sütun denen yerden, yaklaşık sekiz stadion, yolun yarısından
            fazlası dik bir yokuş; tayfalar yelkenler açık gemilerde oturuyordu
            ve 67 gemi, Galata’nın biraz ötesindeki Soğuksular denen koya
            indirildi.
        sources: [kritoboulos-muller-1870]
      - who: {en: 'Âşıkpaşaoğlu, Ottoman chronicler, 1480s', tr: 'Âşıkpaşaoğlu, Osmanlı vakanüvisi, 1480’ler'}
        side: ottoman
        says:
          en: >-
            Seventy ships set sail on the upper side of Galata, through the
            wood, and came down into the sea at the foot of the walls.
          tr: >-
            “Yetmiş pâre gemi dahı Galata’nun üstü yanından, korudan yelkenin
            açdılar”; surun dibinde denize indiler.
        sources: [apz-atsiz-1949]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            No one who saw it described the route. Pears weighed a road from
            Dolmabahçe over Taksim against a shorter one from Tophane, both to
            Kasımpaşa, and preferred Tophane. Two writers on the Ottoman side
            give far fewer ships: Heirullah twenty, Konstantin Mihailović, a
            Serb in the Janissaries, thirty.
          tr: >-
            Bunu görenlerden hiçbiri güzergâhı anlatmadı. Pears, Dolmabahçe’den
            Taksim üzerinden giden bir yolu Tophane’den çıkan daha kısa bir
            yolla karşılaştırdı, ikisi de Kasımpaşa’ya iniyordu; Tophane’yi
            yeğledi. Osmanlı tarafından iki yazar çok daha az gemi verir:
            Hayrullah yirmi, Yeniçerilerde bulunan Sırp Konstantin Mihailović
            otuz.
        sources: [pears-1903]
    sources: [barbaro-1856, doukas-magoulias-1975, kritoboulos-muller-1870, apz-atsiz-1949, pears-1903]
  - id: fireships
    kind: fleet
    day: 23
    until: 23
    shape: [[41.0305, 28.9672]]
    certainty: conjectural
    label: {en: The night attack fails, tr: Gece baskını başarısız}
    note:
      en: >-
        A night attempt to burn the Ottoman ships in the Golden Horn; the
        Ottomans were waiting, and Giacomo Coco’s galley was sunk.
      tr: >-
        Haliç’teki Osmanlı gemilerini yakmak için bir gece denemesi; Osmanlılar
        hazırdı ve Giacomo Coco’nun kadırgası batırıldı.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            A council of twelve decided on 23 April to burn the fleet; on 28
            April the attack under Giacomo Coco failed. He blames the Genoese of
            Pera for warning the Turks.
          tr: >-
            On ikiler meclisi 23 Nisan’da donanmayı yakmaya karar verdi; 28
            Nisan’da Giacomo Coco komutasındaki saldırı başarısız oldu. Barbaro,
            Türkleri uyardıkları için Peralı Cenevizlileri suçlar.
        sources: [barbaro-1856]
    sources: [barbaro-1856, wp-fall-of-constantinople-1386410654]
  - id: mines
    kind: mine
    day: 41
    until: 50
    shape: {feature: gate-of-kaligaria}
    certainty: approximate
    label: {en: Mines at the Kaligaria, tr: Kaligaria’da lağımlar}
    note:
      en: >-
        Miners from Novo Brdo in Serbia dug under the single wall by the
        Kaligaria, where there was no moat; the defenders dug against them.
      tr: >-
        Sırbistan’daki Novo Brdo’dan gelen lağımcılar, hendeğin olmadığı
        Kaligaria yanındaki tek surun altını kazdı; savunanlar karşı lağımla
        karşılık verdi.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            On 16 May a mine was found at the Kaligaria, dug there because
            there were no barbicans. The megadux had the city’s own masters dig
            a countermine and burn its props. More mines were found up to 25
            May.
          tr: >-
            16 Mayıs’ta Kaligaria’da bir lağım bulundu; orada barbakan olmadığı
            için kazılmıştı. Megadüks, şehrin kendi ustalarına karşı lağım
            kazdırıp desteklerini yaktırdı. 25 Mayıs’a kadar başka lağımlar da
            bulundu.
        sources: [barbaro-1856]
      - who: {en: 'Leonard of Chios, Genoese-born archbishop, as van Millingen cites him', tr: 'Sakızlı Leonardo, Ceneviz kökenli başpiskopos, van Millingen’in aktardığı gibi'}
        side: genoese
        says:
          en: All the mines were countermined by John Grant, a German engineer.
          tr: Bütün lağımlara Alman bir mühendis, John Grant, karşı lağım açtı.
        sources: [van-millingen-1899]
      - who: {en: Wikipedia, tr: Wikipedia}
        side: modern
        says:
          en: >-
            The witnesses call Grant a German; that he was a Scot is a modern
            guess from his name.
          tr: >-
            Tanıklar Grant’i Alman diye anar; İskoç olduğu, adından çıkarılmış
            modern bir tahmindir.
        sources: [wp-johannes-grant-1368880213]
    sources: [barbaro-1856, van-millingen-1899, wp-johannes-grant-1368880213]
  - id: bridge
    kind: bridge
    day: 44
    shape: [[41.0425, 28.9452], [41.0462, 28.9512]]
    certainty: conjectural
    label: {en: The barrel bridge, tr: Fıçı köprüsü}
    note:
      en: >-
        A floating bridge of over a thousand wine barrels across the upper
        Golden Horn near Ayvansaray. Where exactly it crossed is not known.
      tr: >-
        Ayvansaray yakınında, Haliç’in iç kısmında, binden fazla şarap
        fıçısından yapılmış yüzer bir köprü. Tam olarak nereden geçtiği
        bilinmiyor.
    accounts:
      - who: {en: 'Doukas, as Pears follows him', tr: 'Dukas, Pears’ün izlediği gibi'}
        side: byzantine
        says:
          en: Barrels lashed two by two, planked for five soldiers abreast.
          tr: İkişer ikişer bağlanmış fıçılar, beş asker yan yana geçecek kadar tahta döşenmiş.
        sources: [pears-1903]
      - who: {en: 'Nicolò Barbaro, as Magoulias notes', tr: 'Nicolò Barbaro, Magoulias’ın notuna göre'}
        side: venetian
        says:
          en: Built on 19 May, and never used, because the Turks did not need it.
          tr: 19 Mayıs’ta yapıldı ve hiç kullanılmadı, çünkü Türklerin ona ihtiyacı olmadı.
        sources: [doukas-magoulias-1975]
    sources: [pears-1903, doukas-magoulias-1975]
  - id: final-assault
    kind: assault
    day: 54
    # From 900 m outside to the wall at chainage 4,250 m.
    shape: [[41.029458, 28.92089], [41.024139, 28.929001]]
    certainty: approximate
    label: {en: The last assault, tr: Son saldırı}
    note:
      en: >-
        Before dawn on 29 May the army attacked along the whole land front,
        hardest in the Lycus valley, in three waves; the Janissaries came last.
        The three-wave scheme is the historians’ simplification.
      tr: >-
        29 Mayıs’ta şafaktan önce ordu bütün kara cephesi boyunca saldırdı; en
        sert saldırı Likos vadisindeydi, üç dalga hâlinde, en son Yeniçeriler.
        Üç dalga şeması tarihçilerin sadeleştirmesidir.
    accounts:
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            Three hours before day the sultan came to the walls in person. First
            came Christians in his service and a rabble with ladders, then a
            second wave, then the Janissaries, on the side of St Romanus; the
            great bombard fired an hour before day.
          tr: >-
            Gün doğmadan üç saat önce sultan surlara bizzat geldi. Önce onun
            hizmetindeki Hristiyanlar ve merdivenli bir kalabalık, sonra ikinci
            bir dalga, sonra Yeniçeriler geldi, Romanos tarafından; büyük
            bombarda gün doğmadan bir saat önce ateşlendi.
        sources: [barbaro-1856]
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            At sunset on Monday the call to battle rang out; Mehmed was on
            horseback opposite the fallen walls with his household troops.
          tr: >-
            Pazartesi gün batarken savaş çağrısı yükseldi; Mehmed, hassa
            askerleriyle yıkılmış surların karşısında at üstündeydi.
        sources: [doukas-magoulias-1975]
    sources: [barbaro-1856, doukas-magoulias-1975, van-millingen-1899]
  - id: stockade
    kind: breach
    day: 54
    shape: [[41.024139, 28.929001]]
    certainty: approximate
    label: {en: Giustiniani falls back, tr: Giustiniani çekiliyor}
    note:
      en: >-
        Giovanni Giustiniani, who led the defence of the land walls, was badly
        wounded at dawn and was carried to his ship; the defence of the
        stockade broke. He died of the wound days later.
      tr: >-
        Kara surlarının savunmasını yöneten Giovanni Giustiniani şafakta ağır
        yaralandı ve gemisine taşındı; şarampolenin savunması çöktü. Birkaç
        gün sonra yarasından öldü.
    accounts:
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            A lead shot went through the back of his arm and his breastplate;
            he said he would go to the ship to have the wound seen to.
          tr: >-
            Bir kurşun kolunun arkasından ve göğüs zırhından geçti; yarasına
            baktırmak için gemiye gideceğini söyledi.
        sources: [doukas-magoulias-1975]
      - who: {en: Nicolò Barbaro, tr: Nicolò Barbaro}
        side: venetian
        says:
          en: >-
            Mentions no wound: he accuses the Genoese commander of deserting his
            post and crying that the Turks were in.
          tr: >-
            Yaradan söz etmez: Cenevizli komutanı mevziini terk etmek ve
            Türklerin içeri girdiğini haykırmakla suçlar.
        sources: [barbaro-1856, pears-1903]
      - who: {en: Kritoboulos, tr: Kritobulos}
        side: ottomanGreek
        says:
          en: >-
            A shot struck Giustiniani in the chest through his breastplate and
            he was carried off; his men left the stockade. The Janissaries drove
            the defenders back through the postern Giustiniani had opened in the
            great wall, and there the emperor Constantine fell fighting.
          tr: >-
            Bir atış Giustiniani’yi göğüs zırhının içinden göğsünden vurdu ve
            taşındı; adamları şarampoleyi bıraktı. Yeniçeriler savunanları
            Giustiniani’nin büyük surda açtırdığı küçük kapıdan geri sürdü;
            imparator Konstantinos orada savaşarak düştü.
        sources: [kritoboulos-muller-1870]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            Every account puts the wound in a different place; it proved mortal
            within days, at or near Chios.
          tr: >-
            Her anlatı yarayı başka bir yere koyar; yara birkaç gün içinde,
            Sakız’da ya da yakınında öldürücü oldu.
        sources: [pears-1903]
    sources: [doukas-magoulias-1975, barbaro-1856, kritoboulos-muller-1870, pears-1903]
  - id: kerkoporta
    kind: legend
    day: 54
    shape: {place: kerkoporta}
    certainty: conjectural
    label: {en: The Kerkoporta, tr: Kerkoporta}
    note:
      en: >-
        A postern left open, in one account only. Its place is a mapped
        convention, and whether it mattered is doubted.
      tr: >-
        Yalnızca tek bir anlatıda geçen, açık bırakılmış küçük bir kapı. Yeri
        haritadaki bir uzlaşımdır; önemli olup olmadığı da şüphelidir.
    accounts:
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            An old postern called the Kerkoporta, reopened for sorties, was
            found open; about fifty Turks got in, climbed the wall and raised
            their banners.
          tr: >-
            Çıkış hücumları için yeniden açılmış Kerkoporta adlı eski bir küçük
            kapı açık bulundu; elli kadar Türk içeri girip sura çıktı ve
            sancaklarını dikti.
        sources: [doukas-magoulias-1975]
      - who: {en: 'Edwin Pears, 1903', tr: 'Edwin Pears, 1903'}
        side: modern
        says:
          en: >-
            The other witnesses do not mention it. The break at the stockade and
            Giustiniani’s withdrawal decided the day.
          tr: >-
            Öteki tanıklar bundan söz etmez. Günü belirleyen, şarampoledeki
            yarma ve Giustiniani’nin çekilmesiydi.
        sources: [pears-1903]
    sources: [doukas-magoulias-1975, pears-1903, van-millingen-1899]
  - id: entry
    kind: assault
    day: 54
    shape: {between: [{gate: gate-of-charisius}, {place: hagia-sophia}]}
    certainty: conjectural
    label: {en: Mehmed rides to Hagia Sophia, tr: Mehmed Ayasofya’ya gidiyor}
    note:
      en: >-
        That afternoon Mehmed rode into the city and went to Hagia Sophia. The
        line runs from Edirnekapı, the Ottoman tradition’s gate; a later Greek
        chronicle names St Romanus. No street is traced.
      tr: >-
        O öğleden sonra Mehmed şehre girdi ve Ayasofya’ya gitti. Çizgi, Osmanlı
        geleneğinin kapısı Edirnekapı’dan çıkar; sonraki bir Rum kroniği
        Romanos Kapısı’nı anar. Hiçbir sokak izlenmedi.
    accounts:
      - who: {en: Doukas, tr: Dukas}
        side: byzantine
        says:
          en: >-
            All this happened between the first and the eighth hour of the
            day; then the sultan entered the City, rode to the Great Church,
            dismounted and went in.
          tr: >-
            Bütün bunlar günün birinci saatiyle sekizinci saati arasında oldu;
            sonra sultan şehre girdi, Büyük Kilise’ye gitti, atından inip
            içeri girdi.
        sources: [doukas-magoulias-1975]
      - who: {en: Kritoboulos, tr: Kritobulos}
        side: ottomanGreek
        says:
          en: >-
            Seeing the city’s size and beauty and its ruin, Mehmed wept: what a
            city we have given over to plunder and desolation.
          tr: >-
            Şehrin büyüklüğünü, güzelliğini ve yıkımını görünce Mehmed ağladı:
            ne şehri yağmaya ve yıkıma verdik.
        sources: [kritoboulos-muller-1870]
      - who: {en: Âşıkpaşaoğlu, tr: Âşıkpaşaoğlu}
        side: ottoman
        says:
          en: >-
            After fifty days and nights of fighting, on the fifty-first day, a
            Tuesday, the fortress was taken; on the first Friday after the
            conquest the Friday prayer was said in Ayasofya.
          tr: >-
            Elli gün, gece ve gündüz cenk olundu; “elli birinci gün seşenbih
            güni idi, hisar feth olındı”. Fethin ilk cuma günü Ayasofya’da cuma
            namazı kılındı.
        sources: [apz-atsiz-1949]
      - who: {en: 'Alexander van Millingen, historian, 1899', tr: 'Alexander van Millingen, tarihçi, 1899'}
        side: modern
        says:
          en: >-
            A later chronicle has him enter through the Gate of St Romanus
            about midday; Ottoman tradition says Edirnekapı.
          tr: >-
            Sonraki bir kronik onu öğle vakti Romanos Kapısı’ndan sokar;
            Osmanlı geleneği Edirnekapı der.
        sources: [van-millingen-1899, wp-walls-of-constantinople-1383343183]
    sources: [doukas-magoulias-1975, kritoboulos-muller-1870, apz-atsiz-1949, van-millingen-1899]

reveal:
  seconds: 12
  event: ships-overland
  view: {lat: 41.031, lng: 28.976, width: 3800}
  caption:
    en: >-
      22 April 1453: about seventy ships over the hill behind Galata and into
      the Golden Horn, around the chain. The route is one reading; no witness
      describes it.
    tr: >-
      22 Nisan 1453: yetmiş kadar gemi Galata’nın arkasındaki tepeden aşırılıp
      zincirin gerisinden Haliç’e indi. Güzergâh okumalardan biridir; hiçbir
      tanık onu tarif etmez.

beats:
  - id: prelude
    day: 1
    seconds: 6
    view: {lat: 41.07, lng: 29.045, width: 6000}
    focus: [rumeli-hisari]
    label: {en: '1452: the fortress', tr: '1452: hisar'}
    caption:
      en: >-
        A year before, Mehmed II builds Rumeli Hisarı where the Bosphorus is
        narrowest, opposite his great-grandfather’s Anadolu Hisarı.
      tr: >-
        Bir yıl önce II. Mehmed, Boğaz’ın en dar yerinde, büyük dedesinin
        yaptırdığı Anadolu Hisarı’nın karşısına Rumeli Hisarı’nı yaptırır.
    sources: [doukas-magoulias-1975, ktb-rumeli-hisari, wp-anadoluhisari-1365021404]
  - id: chain
    day: 1
    seconds: 6
    view: {lat: 41.0205, lng: 28.978, width: 3000}
    focus: [chain]
    label: {en: The chain, tr: Zincir}
    caption:
      en: From 2 April a boom closes the Golden Horn between the city and Galata.
      tr: 2 Nisan’dan itibaren bir engel, Haliç’i şehirle Galata arasında kapatır.
    sources: [barbaro-1856]
  - id: arrival
    day: 1
    seconds: 7
    view: {lat: 41.019, lng: 28.926, width: 6500}
    focus: [camp, great-gun]
    label: {en: '6 April: the siege begins', tr: '6 Nisan: kuşatma başlıyor'}
    caption:
      en: >-
        The army camps along the land walls; the great gun stands opposite the
        Gate of St Romanus.
      tr: >-
        Ordu kara surları boyunca konaklar; büyük top Romanos Kapısı’nın
        karşısındadır.
    sources: [doukas-magoulias-1975, barbaro-1856]
  - id: fleet
    day: 7
    seconds: 6
    view: {lat: 41.031, lng: 28.99, width: 5500}
    focus: [fleet-columns]
    label: {en: '12 April: the fleet', tr: '12 Nisan: donanma'}
    caption:
      en: The Ottoman fleet anchors on the Bosphorus, outside the chain.
      tr: Osmanlı donanması zincirin dışında, Boğaz’da demirler.
    sources: [barbaro-1856, pears-1903]
  - id: first-assault
    day: 13
    seconds: 6
    view: {lat: 41.025, lng: 28.926, width: 2600}
    focus: [assault-18-april]
    label: {en: '18 April: the first assault', tr: '18 Nisan: ilk saldırı'}
    caption:
      en: A night attack in the Lycus valley is thrown back.
      tr: Likos vadisindeki bir gece saldırısı püskürtülür.
    sources: [barbaro-1856, pears-1903]
  - id: four-ships
    day: 15
    seconds: 6
    view: {lat: 41.011, lng: 28.986, width: 4500}
    focus: [four-ships]
    label: {en: '20 April: four ships', tr: '20 Nisan: dört gemi'}
    caption:
      en: Christian ships fight their way through the Ottoman fleet into the Golden Horn.
      tr: Hristiyan gemileri Osmanlı donanmasını yarıp Haliç’e girer.
    sources: [barbaro-1856, doukas-magoulias-1975]
  - id: overland
    day: 17
    seconds: 9
    view: {lat: 41.031, lng: 28.976, width: 3800}
    focus: [ships-overland]
    label: {en: '22 April: ships over the hill', tr: '22 Nisan: karadan gemiler'}
    caption:
      en: >-
        About seventy ships are hauled behind Galata into the Golden Horn; now
        the harbour walls must be manned too.
      tr: >-
        Yetmiş kadar gemi Galata’nın arkasından Haliç’e indirilir; artık liman
        surlarını da beklemek gerekir.
    sources: [barbaro-1856, doukas-magoulias-1975, pears-1903]
  - id: fireships
    day: 23
    seconds: 5
    view: {lat: 41.031, lng: 28.966, width: 3000}
    focus: [fireships]
    label: {en: '28 April: the night attack', tr: '28 Nisan: gece baskını'}
    caption:
      en: An attempt to burn the ships in the Horn fails.
      tr: Haliç’teki gemileri yakma denemesi başarısız olur.
    sources: [barbaro-1856]
  - id: mines
    day: 41
    seconds: 6
    view: {lat: 41.0355, lng: 28.937, width: 2200}
    focus: [mines]
    label: {en: '16 May: mines', tr: '16 Mayıs: lağımlar'}
    caption:
      en: Mines under the wall at the Kaligaria; the defenders dig against them.
      tr: Kaligaria’da surun altında lağımlar; savunanlar karşı lağım kazar.
    sources: [barbaro-1856, van-millingen-1899]
  - id: bridge
    day: 44
    seconds: 5
    view: {lat: 41.042, lng: 28.947, width: 3000}
    focus: [bridge]
    label: {en: '19 May: the bridge', tr: '19 Mayıs: köprü'}
    caption:
      en: A bridge of barrels crosses the upper Golden Horn.
      tr: Fıçılardan bir köprü Haliç’in iç kısmını geçer.
    sources: [pears-1903, doukas-magoulias-1975]
  - id: eclipse
    day: 47
    seconds: 6
    view: {lat: 41.018, lng: 28.955, width: 8000}
    focus: []
    label: {en: '22 May: the moon', tr: '22 Mayıs: ay'}
    caption:
      en: >-
        The full moon rises in partial eclipse, like a three-day crescent.
        Barbaro writes that the Greeks took it for the sign of a prophecy that
        the city would fall.
      tr: >-
        Dolunay kısmi tutulmayla, üç günlük bir hilal gibi doğar. Barbaro,
        Rumların bunu şehrin düşeceğine dair bir kehanetin işareti saydığını
        yazar.
    sources: [barbaro-1856, eclipsewise-1453-05-22]
  - id: assault
    day: 54
    seconds: 8
    view: {lat: 41.0255, lng: 28.926, width: 2600}
    focus: [final-assault, stockade]
    label: {en: '29 May: the last assault', tr: '29 Mayıs: son saldırı'}
    caption:
      en: >-
        Before dawn, the assault. Giustiniani is wounded and leaves; the
        defence of the stockade breaks.
      tr: >-
        Şafaktan önce saldırı. Giustiniani yaralanıp çekilir; şarampolenin
        savunması çöker.
    sources: [barbaro-1856, doukas-magoulias-1975, pears-1903]
  - id: kerkoporta
    day: 54
    seconds: 6
    view: {lat: 41.031, lng: 28.936, width: 2200}
    focus: [kerkoporta]
    label: {en: 'A postern, in one account', tr: Tek anlatıda bir kapı}
    caption:
      en: Doukas alone tells of a postern left open. Its place is a convention.
      tr: Açık bırakılmış bir küçük kapıyı yalnızca Dukas anlatır. Yeri bir uzlaşımdır.
    sources: [doukas-magoulias-1975, pears-1903]
  - id: entry
    day: 54
    seconds: 7
    view: {lat: 41.018, lng: 28.955, width: 8000}
    focus: [entry]
    label: {en: '29 May: the city taken', tr: '29 Mayıs: şehir alınır'}
    caption:
      en: >-
        Constantine XI dies at the walls; no reliable witness saw how. That
        afternoon Mehmed rides into the city and goes to Hagia Sophia.
        Âşıkpaşaoğlu counts it the fifty-first day of fighting.
      tr: >-
        XI. Konstantinos surlarda ölür; nasıl öldüğünü güvenilir bir tanık
        görmedi. O öğleden sonra Mehmed şehre girer ve Ayasofya’ya gider.
        Âşıkpaşaoğlu bunu savaşın elli birinci günü sayar.
    sources: [pears-1903, doukas-magoulias-1975, apz-atsiz-1949, van-millingen-1899]

stills: [prelude, arrival, overland, mines, assault, entry]
