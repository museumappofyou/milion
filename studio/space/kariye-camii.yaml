# P11 kit spec: Chora (Kariye Camii), Milestone VI "Chora through time".
# Frame: metres, z up, the naos floor at z = 0, the origin under the centre of
# the naos dome, +y along the axis toward the apse (bearing 104.5°), +x then
# to the south. Plan positions are traced from Van Millingen's measured plan
# (1912, Fig. 105; tool/content/chora_plan.py, the guide's plan, uses the same
# readings): x = −v, y = u there. Cited dimensions are checked against the
# geometry. No accessible text gives Chora's heights or wall thicknesses: the
# walls (naos 9.5 m, narthexes 7–8 m, parekklesion 9 m), vault springings,
# drums and the belfry and minaret are estimates in proportion, and say so.
schemaVersion: 1
id: kariye-camii
place: chora
title: {en: "Chora through time", tr: "Zaman içinde Kariye"}
description:
  en: >-
    Four building campaigns in one small church, drawn from below: the vaulted
    substructures of the sixth century, Maria Doukaina's church of about
    1077–81, its rebuilding with a broad apse early in the twelfth century,
    and Theodore Metochites' work of about 1316–21, which rebuilt the dome and
    side chapels and wrapped the church in two narthexes, a north annex, a
    domed funeral chapel and a belfry. The scrubber ends with the Ottoman
    mosque, its minaret in the belfry's corner. Plan from Van Millingen's
    measured drawing; heights are estimates. A diagram, not a survey.
  tr: >-
    Küçük bir kilisede dört yapım evresi, aşağıdan çizilmiş: 6. yüzyılın
    tonozlu alt yapıları, Maria Dukaina'nın yaklaşık 1077–81 tarihli
    kilisesi, 12. yüzyılın başında geniş bir apsisle yeniden yapılışı ve
    Theodoros Metokhites'in yaklaşık 1316–21 tarihli işi: kubbeyi ve yan
    şapelleri yeniden yaptırdı, kiliseyi iki narteks, kuzey ek yapısı, kubbeli
    bir mezar şapeli ve bir çan kulesiyle çevirdi. Zaman çubuğu Osmanlı
    camisiyle biter; minaresi çan kulesinin köşesindedir. Plan Van
    Millingen'in ölçekli çiziminden; yükseklikler tahmindir. Bu bir şemadır,
    rölöve değildir.
eras: [byzantine, ottoman]
honesty: RECONSTRUCTION
