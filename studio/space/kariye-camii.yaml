steps:
  - id: substructure
    parts: [substructure]
    seconds: 2.2
    epochs: []
    sources: [ousterhout-introduction]
    label: {en: "Sixth-century foundations", tr: "6. yüzyıl temelleri"}
    caption:
      en: >-
        The oldest evidence is underground: vaulted substructures of the sixth
        century in the foundations of the naos. Their shape is not drawn.
      tr: >-
        En eski iz yerin altında: naosun temellerinde 6. yüzyıldan kalma
        tonozlu alt yapılar. Biçimleri çizilmedi.
  - id: walls
    parts: [floor, naos-wall-*, bema-*]
    seconds: 2.2
    epochs: []
    sources: [ousterhout-introduction]
    label: {en: "Walls of about 1077–81", tr: "Yaklaşık 1077–81 duvarları"}
    caption:
      en: >-
        The north, west and south walls of the naos stand where they were set
        out in the eleventh century, when Maria Doukaina rebuilt the church.
      tr: >-
        Naosun kuzey, batı ve güney duvarları, Maria Dukaina'nın kiliseyi
        yeniden yaptırdığı 11. yüzyılda belirlenen yerlerinde duruyor.
  - id: columns
    parts: [naos-columns]
    seconds: 2.2
    epochs: [1081]
    sources: [wp-the-chora-1381788152]
    label: {en: "An inscribed cross", tr: "Kapalı Yunan haçı"}
    caption:
      en: >-
        Her church was an inscribed cross: four supports under a central dome.
        Where they stood is not known; the drawing places them.
      tr: >-
        Onun kilisesi kapalı Yunan haçı planlıydı: merkezi kubbenin altında
        dört destek. Yerleri bilinmiyor; çizim onları yerleştiriyor.
  - id: narrow-apse
    parts: [apse-narrow*]
    seconds: 2.2
    epochs: [1081]
    sources: [ousterhout-introduction]
    label: {en: "A narrower apse", tr: "Daha dar bir apsis"}
    caption:
      en: >-
        Excavation in 1957–58 found a narrower apse flanked by side apses,
        probably from this church.
      tr: >-
        1957–58 kazısı yan apsislerle çevrili daha dar bir apsis buldu;
        büyük olasılıkla bu kiliseden.
  - id: side-chapels
    parts: [prothesis-wall-*, diakonikon-wall-*, side-apses*]
    seconds: 2.2
    epochs: []
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "Side chapels", tr: "Yan şapeller"}
    caption:
      en: >-
        Two chapels flank the sanctuary, each with its own small apse, three
        faces outside.
      tr: >-
        Kutsal alanın iki yanında birer şapel; her birinin dışta üç yüzlü
        küçük bir apsisi var.
  - id: vaults
    parts: [naos-arms, naos-pendentives, naos-ring]
    seconds: 2.2
    epochs: []
    sources: [van-millingen-1912]
    label: {en: "A short-armed cross", tr: "Kısa kollu bir haç"}
    caption:
      en: >-
        Barrel vaults over short arms and the bema, and pendentives turning
        the square bay into the ring under the dome.
      tr: >-
        Kısa kollar ve bema üzerinde beşik tonozlar; pandantifler kare bölmeyi
        kubbenin altındaki bileziğe çevirir.
  - id: dome-early
    parts: [dome-early*]
    seconds: 2.2
    epochs: [1081, 1120]
    sources: [ousterhout-introduction]
    label: {en: "The first dome", tr: "İlk kubbe"}
    caption:
      en: >-
        A dome over the centre; its form before Metochites rebuilt it is not
        known.
      tr: >-
        Ortada bir kubbe; Metokhites onu yeniden yaptırmadan önceki biçimi
        bilinmiyor.
  - id: piers
    parts: [naos-piers]
    seconds: 2.2
    epochs: [1120, 1321, 1511]
    sources: [ousterhout-introduction]
    label: {en: "Rebuilt on piers", tr: "Ayaklar üzerinde yeniden"}
    caption:
      en: >-
        Early in the twelfth century the church partly collapsed and was
        rebuilt with a more stable design: piers in place of columns.
      tr: >-
        12. yüzyılın başında kilise kısmen çöktü ve daha sağlam bir tasarımla
        yeniden yapıldı: sütunların yerine ayaklar.
  - id: broad-apse
    parts: [apse, apse-cap]
    seconds: 2.2
    epochs: [1120, 1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "The broad apse", tr: "Geniş apsis"}
    caption:
      en: >-
        The present broad apse belongs to this rebuilding: five flat faces
        outside and a triple window.
      tr: >-
        Bugünkü geniş apsis bu yeniden yapıma ait: dışta beş düz yüz ve üçlü
        bir pencere.
  - id: dome
    parts: [naos-dome*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912, wp-the-chora-1381788152]
    label: {en: "Metochites' dome, 7.7 m", tr: "Metokhites'in kubbesi, 7,7 m"}
    caption:
      en: >-
        Metochites rebuilt the dome, 7.7 m across, on a ribbed drum of sixteen
        segments pierced by eight windows. Its crown is Ottoman.
      tr: >-
        Metokhites 7,7 m çapındaki kubbeyi on altı dilimli, sekiz pencereli
        bir kasnak üzerinde yeniden yaptırdı. Tepesi Osmanlı işi.
  - id: chapel-domes
    parts: [prothesis-dome*, diakonikon-dome*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "Side chapels rebuilt", tr: "Yan şapeller yeniden"}
    caption:
      en: >-
        He rebuilt the side chapels too: the north one under a dome of eight
        concave sections, the south one under a plain dome.
      tr: >-
        Yan şapelleri de yeniden yaptırdı: kuzeydekini sekiz iç bükey dilimli
        bir kubbeyle, güneydekini düz bir kubbeyle.
  - id: annex
    parts: [annex-*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "A two-storey annex", tr: "İki katlı ek yapı"}
    caption:
      en: >-
        On the north, a two-storey annex: barrel-vaulted, the upper floor with
        a small window looking into the church.
      tr: >-
        Kuzeyde iki katlı bir ek yapı: beşik tonozlu; üst katında kiliseye
        bakan küçük bir pencere.
  - id: inner-narthex
    parts: [inner-*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "The inner narthex", tr: "İç narteks"}
    caption:
      en: >-
        To the west, an inner narthex of four bays, domes over the end bays:
        the north one of sixteen segments, the south one larger.
      tr: >-
        Batıda dört bölmeli bir iç narteks; uç bölmelerin üstünde kubbeler:
        kuzeydeki on altı dilimli, güneydeki daha büyük.
  - id: outer-narthex
    parts: [outer-*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [van-millingen-1912, ousterhout-2002]
    label: {en: "The outer narthex, seven bays", tr: "Dış narteks, yedi bölme"}
    caption:
      en: >-
        An outer narthex of seven bays under dome vaults: five along the front
        and two returned at the south end, in front of the funeral chapel.
      tr: >-
        Kubbemsi tonozlu yedi bölmeli bir dış narteks: beşi cephe boyunca,
        ikisi güney uçta mezar şapelinin önüne dönerek.
  - id: parekklesion
    parts: [parek-*]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [van-millingen-1912, wp-the-chora-1381788152]
    label: {en: "The funeral chapel", tr: "Mezar şapeli"}
    caption:
      en: >-
        On the south, the parekklesion: a high drum dome of twelve windows,
        4.5 m across, over its west bay, a dome vault over the east bay, an
        apse.
      tr: >-
        Güneyde parekklesion: batı bölmesinin üstünde on iki pencereli yüksek
        kasnaklı, 4,5 m çapında bir kubbe, doğu bölmede kubbemsi bir tonoz ve
        bir apsis.
  - id: belfry
    parts: [belfry*]
    seconds: 2.2
    epochs: [1321]
    sources: [ousterhout-introduction]
    label: {en: "A belfry", tr: "Bir çan kulesi"}
    caption:
      en: >-
        A belfry over the south-west corner bay, marked with Metochites'
        monograms. No document describes it; its height is a guess.
      tr: >-
        Güneybatı köşe bölmesinin üstünde Metokhites'in monogramlarını taşıyan
        bir çan kulesi. Onu anlatan bir belge yok; yüksekliği tahmindir.
  - id: buttress
    parts: [flying-buttress]
    seconds: 2.2
    epochs: [1321, 1511]
    sources: [ousterhout-introduction, van-millingen-1912]
    label: {en: "A flying buttress", tr: "Bir uçan payanda"}
    caption:
      en: >-
        Last, a flying buttress to hold the twelfth-century apse, an idea
        rare in Byzantine building.
      tr: >-
        Son olarak 12. yüzyıl apsisini tutmak için bir uçan payanda; Bizans
        yapılarında nadir bir fikir.
  - id: minaret
    parts: [minaret*]
    seconds: 2.2
    epochs: [1511]
    sources: [ousterhout-introduction]
    label: {en: "The minaret", tr: "Minare"}
    caption:
      en: >-
        Between 1495 and 1511 the church became a mosque: a mihrab in the
        apse, and a minaret in place of the belfry.
      tr: >-
        1495 ile 1511 arasında kilise camiye çevrildi: apsiste bir mihrap ve
        çan kulesinin yerine bir minare.
reveal:
  through: dome-early
  seconds: 8.0
  turnDegrees: 30
  caption:
    en: "Maria Doukaina's church of about 1077–81: an inscribed cross under a dome, on sixth-century foundations."
    tr: "Maria Dukaina'nın yaklaşık 1077–81 tarihli kilisesi: 6. yüzyıl temelleri üstünde, kubbeli bir kapalı Yunan haçı."
