# P13 kit spec: the Milion, Milestone 0. The domed tetrapylon at the head of
# the Mese, set up when Constantine refounded the city (dedicated 330), drawn
# around the marble fragment that stands on Divanyolu today. Frame: metres,
# z up, today's pavement of the fragment's pit at z = 0, the fragment's
# centre on the origin, +y west along the Mese (Divanyolu), +x to its right
# (north).
# No source gives the Milion's size or attests its form: texts name its arches
# and vault, and Mango (1959) calls a domed tetrapylon "quite likely"; the 1969
# sounding report (Fıratlı and Ergil) was not read. Everything here is set in
# proportion — piers 3 m square, openings 5 m, the vault's crown about 12 m —
# so no caption states a size and no dimension is checked. The fragment is
# drawn from a photograph (about 0.9 × 0.7 m and 4 m tall), not measured; where
# it stood in the monument is not known, and it is drawn as the foot of one
# pier, the seam left open.
schemaVersion: 1
id: milion
place: milion
title: {en: "The Milion", tr: "Milyon Taşı"}
description:
  en: >-
    The Milion as a drawing: the marble fragment that stands on Divanyolu
    today, and around it the domed arch of four piers that Byzantine writers
    describe at the head of the Mese, the street that led west out of the
    city. Its size is not known; it is drawn in proportion, a reconstruction
    from texts, not a survey.
  tr: >-
    Bir çizim olarak Milyon Taşı: bugün Divanyolu'nda duran mermer parça ve
    onun çevresinde, Bizans yazarlarının şehirden batıya çıkan Mese'nin
    başında anlattığı, dört ayaklı kubbeli kemer. Boyutları bilinmiyor;
    oranlarla çizildi. Rölöve değil, metinlerden bir rekonstrüksiyondur.
eras: [byzantine, modern]
honesty: RECONSTRUCTION
orientation:
  axis: 271.5
  source: osm-way-228463988
  line:   # [lat, lon], OSM way 228463988 (Divanyolu Caddesi past the Milion), east end → west end
    - [41.0079884, 28.9782733]
    - [41.0080363, 28.9758859]
step: 1.5
epochs:
  - {year: 330, label: {en: "Constantine's city, after 330", tr: "Konstantin'in şehri, 330 sonrası"}}
  - {year: 2026, label: {en: "Divanyolu today", tr: "Bugün Divanyolu"}}
parts:
  - id: fragment
    kind: fragment
    material: marble
    note: the surviving fragment, drawn from a photograph; its top as it broke
    at: [[0, 0]]
    params: {width: 0.9, depth: 0.7, heights: [3.9, 4.25, 3.7, 4.05]}
  # The pier the fragment is drawn in: the rest of its foot, then its upper
  # part above the break (the seam left open).
  - id: pier-fragment
    kind: pier
    at: [{at: [1.52, 1.15]}]
    params: {width: 2.06, depth: 3.0, height: 4.3}
  - id: pier-fragment-back
    kind: pier
    at: [{at: [0.0, 1.52]}]
    params: {width: 0.9, depth: 2.26, height: 4.3}
  - id: pier-fragment-top
    kind: pier
    at: [{at: [1.05, 1.15], z: 4.3}]
    params: {width: 3.0, depth: 3.0, height: 5.7}
  - id: piers
    kind: pier
    note: the other three piers
    at: [[9.05, 1.15], [1.05, 9.15], [9.05, 9.15]]
    params: {width: 3.0, depth: 3.0, height: 10.0}
  - id: arches
    kind: arched-panel
    note: four arches, 5 m clear, springing at 7 m, their spandrels up to the attic
    at: [{at: [5.05, 1.15], z: 7}, {at: [5.05, 9.15], z: 7},
         {at: [1.05, 5.15], z: 7, turn: 90}, {at: [9.05, 5.15], z: 7, turn: 90}]
    params: {span: 5.0, top: 3.0, depth: 3.0}
  - id: pendentives
    kind: pendentives
    at: [{at: [5.05, 5.15], z: 7}]
    params: {half: 2.5, top: 2.5, step: 1.0}
  - id: vault
    kind: dome
    material: lead
    note: the domical vault; its profile is not known
    at: [{at: [5.05, 5.15], z: 9.5}]
    params: {radius: 2.5, thickness: 0.4, n: 16, rows: 4}
  - id: mese
    kind: slab
    note: the Mese, leading west; drawn 10 m wide, its width here a sign
    at: [{at: [5.05, 21.15]}]
    params: {width: 10, depth: 21, thickness: 0.2, step: 6.0}
  - id: augustaion-road
    kind: slab
    note: the way east to the Augustaion and Hagia Sophia
    at: [{at: [5.05, -8.85]}]
    params: {width: 10, depth: 17, thickness: 0.2, step: 6.0}
  - id: divanyolu
    kind: slab
    note: Divanyolu today, past the fragment
    at: [{at: [-6.0, 6.0]}]
    params: {width: 9, depth: 44, thickness: 0.2, step: 6.0}
  - id: tram
    kind: slab
    note: the T1 tram's two tracks, drawn as one strip
    at: [{at: [-6.0, 6.0], z: 0.2}]
    params: {width: 3.4, depth: 44, thickness: 0.1, step: 6.0}
steps:
  - id: fragment
    parts: [fragment]
    seconds: 3.4
    epochs: []
    sources: [wp-milion-1374763433, byzleg-milion, firatli-ergil-1969]
    label: {en: "What survives", tr: "Geriye kalan"}
    caption:
      en: >-
        In 1967 and 1968, after houses were pulled down on Divanyolu,
        excavators found the Milion's foundations and this marble fragment,
        now set up as a pillar.
      tr: >-
        1967 ve 1968'de Divanyolu'nda evler yıkıldıktan sonra kazıcılar
        Milyon Taşı'nın temellerini ve bugün bir dikme gibi duran bu mermer
        parçayı buldu.
  - id: piers
    parts: [pier-fragment, pier-fragment-back, pier-fragment-top, piers]
    seconds: 3.2
    epochs: [330]
    sources: [mango-1959-brazen-house, byzantium1200-milion, wp-milion-1374763433]
    label: {en: "Four piers", tr: "Dört ayak"}
    caption:
      en: >-
        Texts speak of its arches and its vault; four piers in a square is
        the likely form. Its size is not known, so it is drawn in proportion.
      tr: >-
        Metinler kemerlerinden ve tonozundan söz eder; kare planlı dört ayak
        en olası biçimdir. Boyutları bilinmediği için oranlarla çizildi.
  - id: arches
    parts: [arches]
    seconds: 3.2
    epochs: [330]
    sources: [suda-mu-1065, wp-milion-1374763433]
    label: {en: "Four arches", tr: "Dört kemer"}
    caption:
      en: >-
        Statues of Constantine and his mother Helena holding a cross stood on
        it, with the city's Tyche behind them, Byzantine writers record.
      tr: >-
        Bizans yazarlarına göre üstünde Konstantin ile annesi Helena'nın bir
        haçı birlikte tutan heykelleri, arkalarında da şehrin Tykhe'si
        dururdu.
  - id: vault
    parts: [pendentives, vault]
    seconds: 3.6
    epochs: [330]
    sources: [byzantium1200-milion, wp-milion-1374763433, byzleg-milion]
    label: {en: "The vault", tr: "Tonoz"}
    caption:
      en: >-
        A domical vault covered the square. In the 8th century it was painted
        with the Church councils; the iconoclast Constantine V had them
        replaced with scenes of the Hippodrome and his favourite charioteer.
      tr: >-
        Kareyi kubbemsi bir tonoz örtüyordu. 8. yüzyılda kilise konsilleriyle
        boyandı; ikonakırıcı V. Konstantin bunların yerine Hipodrom
        sahnelerini ve en sevdiği arabacıyı yaptırdı.
  - id: roads
    parts: [mese, augustaion-road]
    seconds: 4.2
    epochs: [330]
    sources: [byzleg-milion, byzleg-hebdomon, csel39-geyer-1898]
    label: {en: "Mile zero", tr: "Sıfır mil"}
    caption:
      en: >-
        Miles were counted from here: the Hebdomon, the suburb where emperors
        were proclaimed, took its name from the seventh mile west along the
        road to Thrace.
      tr: >-
        Mil buradan sayılırdı: imparatorların ilan edildiği Hebdomon
        banliyösü adını Trakya yolu üzerinde batıdaki yedinci milden aldı.
  - id: street
    parts: [divanyolu, tram]
    seconds: 4.4
    epochs: [2026]
    sources: [wp-milion-1374763433, byzantium1200-milion, osm-way-228463988]
    label: {en: "Divanyolu", tr: "Divanyolu"}
    caption:
      en: >-
        Last mentioned in the 13th century, the Milion was gone by the early
        16th, cleared for an Ottoman water tower. The Mese is Divanyolu now,
        and the T1 tram runs along it.
      tr: >-
        En son 13. yüzyılda anılan Milyon Taşı, 16. yüzyılın başında bir
        Osmanlı su terazisine yer açılırken ortadan kalkmıştı. Mese bugün
        Divanyolu; T1 tramvayı onun üzerinden geçer.
reveal:
  through: vault
  seconds: 8.0
  turnDegrees: 24
  caption:
    en: "A fragment on Divanyolu, and around it the arch where the empire's miles began."
    tr: "Divanyolu'nda bir parça ve çevresinde imparatorluğun millerinin başladığı kemer."
choisy:
  sectionHeight: 5.5
  elevation: -38
  azimuth: 225
shared: [mango-1959-brazen-house, wp-milion-1374763433, byzleg-milion, firatli-ergil-1969, byzantium1200-milion,
