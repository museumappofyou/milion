steps:
  - id: arena
    parts: [stands-*, back-walls-*]
    seconds: 3.0
    epochs: [330, 1200]
    sources: [tdv-atmeydani, byzleg-hippodrome, tan-hippodrome-underground]
    label: {en: "The racecourse", tr: "Yarış alanı"}
    caption:
      en: >-
        Begun under Septimius Severus around 203 and finished by Constantine
        for the city's dedication on 11 May 330: about 430–480 m long and
        120 m wide, by different estimates.
      tr: >-
        Septimius Severus döneminde 203 dolaylarında başlanan yapı, 11 Mayıs
        330'daki kuruluş töreni için Konstantin'in elinde tamamlandı: farklı
        tahminlere göre 430–480 m uzunluğunda, 120 m genişliğinde.
  - id: sphendone
    parts: [sphendone]
    seconds: 2.8
    epochs: []
    sources: [encrom-sphendone, byzleg-hippodrome, tan-hippodrome-underground]
    label: {en: "The sphendone", tr: "Sphendone"}
    caption:
      en: >-
        The curved south end stood on vaults over ground that falls to the
        sea. Later sealed as a cistern, its wall can still be seen from
        Nakilbent Sokağı.
      tr: >-
        Kavisli güney ucu, denize doğru alçalan arazinin üstünde tonozlara
        oturuyordu. Sonradan sarnıç olarak kapatılan duvarı hâlâ Nakilbent
        Sokağı'ndan görülebilir.
  - id: gates
    parts: [carceres, quadriga-pedestal, quadriga]
    seconds: 3.0
    epochs: [330, 1200]
    sources: [wp-hippodrome-of-constantinople-1364835690, tan-hippodrome-underground, byzleg-hippodrome,
              janin-1950]
    label: {en: "Gates and horses", tr: "Kapılar ve atlar"}
    caption:
      en: >-
        The chariots started from twelve gates at the north end. High above
        the track stood gilded bronze horses, probably the four Venice
        carried off in 1204 to San Marco.
      tr: >-
        Arabalar kuzey uçtaki on iki kapıdan çıkardı. Pistin yükseğinde
        yaldızlı tunç atlar dururdu; büyük olasılıkla Venedik'in 1204'te San
        Marco'ya götürdüğü dört at.
  - id: kathisma
    parts: [kathisma*]
    seconds: 3.0
    epochs: [330, 1200]
    sources: [bit-cetinkaya-bizans-mimarisi, byzleg-hippodrome, procopius-wars-1-24]
    label: {en: "The kathisma", tr: "Kathisma"}
    caption:
      en: >-
        The emperor watched from the kathisma on the east side, which led
        straight into the Great Palace. The Nika riot of January 532 ended in the Hippodrome:
        Procopius counts more than 30,000 dead.
      tr: >-
        İmparator yarışları doğu yandaki, doğrudan Büyük Saray'a açılan
        kathismadan izlerdi. Ocak 532'deki Nika ayaklanması Hipodrom'da bitti:
        Prokopios'a göre 30.000'den fazla kişi öldü.
  - id: spina
    parts: [spina-*, metae-bases, metae]
    seconds: 3.0
    epochs: [330, 1200]
    sources: [tan-hippodrome-underground, janin-1950, byzleg-hippodrome]
    label: {en: "The central barrier", tr: "Orta set"}
    caption:
      en: >-
        A barrier about 2 m wide, the euripus, ran down the middle between
        the turning posts, with statues and monuments along it.
      tr: >-
        Ortadan, dönüş direkleri arasında yaklaşık 2 m genişliğinde bir set,
        euripus, uzanırdı; üstü heykel ve anıtlarla doluydu.
  - id: serpent
    parts: [serpent]
    seconds: 2.8
    epochs: [330, 1200, 1582]
    sources: [bmcr-2017-01-43, byzleg-serpent-column]
    label: {en: "The Serpent Column", tr: "Yılanlı Sütun"}
    caption:
      en: >-
        Constantine set the bronze Serpent Column from Delphi on the barrier,
        its three heads still whole.
      tr: >-
        Konstantin Delfoi'den getirilen tunç Yılanlı Sütun'u, üç başı henüz
        sağlamken, sedin üstüne koydu.
  - id: obelisk
    parts: [obelisk-plinth, obelisk-base, obelisk-cubes, obelisk-shaft]
    seconds: 3.0
    epochs: [1200, 1582, 2026]
    sources: [byzleg-theodosius-obelisk, heurist-cil-iii-737, seuso-obelisk-theodosius]
    label: {en: "Thutmose III's obelisk", tr: "III. Thutmose'un dikilitaşı"}
    caption:
      en: >-
        In 390 the prefect Proclus raised an obelisk of Thutmose III from
        Karnak on a carved base: in 32 days, says the Greek verse; in 30,
        says the Latin as usually read.
      tr: >-
        390'da şehir valisi Proklos, Karnak'tan getirilen bir III. Thutmose
        dikilitaşını kabartmalı bir kaide üstüne dikti: Yunanca dizeye göre
        32, Latincenin genel okunuşuna göre 30 günde.
  - id: walled
    parts: [walled-step*, walled-base, walled-obelisk]
    seconds: 3.0
    epochs: [1200, 1582, 2026]
    sources: [byzleg-masonry-obelisk, wp-walled-obelisk-1365398207, istanbul-gov-2007-monuments]
    label: {en: "The Walled Obelisk", tr: "Örme Dikilitaş"}
    caption:
      en: >-
        About 32 m of masonry, its date unknown. Restored by Constantine VII,
        "now a brazen wonder here", says its base, like Rhodes's Colossus.
        The bronze plates were stripped in 1204.
      tr: >-
        Yaklaşık 32 m'lik bir örgü, tarihi bilinmiyor. VII. Konstantin onu
        onarttı; kaidesindeki yazıt onu Rodos Heykeli'ne benzetip "şimdi
        burada tunçtan bir harika" der. Tunç levhalar 1204'te söküldü.
  - id: palace
    parts: [palace-*]
    seconds: 3.2
    epochs: [1582, 2026]
    sources: [tdv-ibrahim-pasa-sarayi, tan-hippodrome-underground, tdv-atmeydani, tdv-surname,
              janin-1950]
    label: {en: "At Meydanı", tr: "Atmeydanı"}
    caption:
      en: >-
        With most of the stands gone, the square was At Meydanı. İbrahim
        Paşa's palace rose on the west stands' vaults. Murad III's festival for his son
        Mehmed in 1582 lasted 52 days, or 55 by another account.
      tr: >-
        Tribünlerin çoğu gidince meydan Atmeydanı oldu. İbrahim Paşa Sarayı batı
        tribünlerinin tonozları üstünde yükseldi. III. Murad'ın oğlu Mehmed
        için 1582'de düzenlediği şenlik 52, başka bir kayda göre 55 gün
        sürdü.
  - id: today
    parts: [serpent-today, pits, pit-serpent, square-ground]
    seconds: 3.0
    epochs: [2026]
    sources: [byzleg-hippodrome, encrom-sphendone, encrom-serpentine]
    label: {en: "In their pits", tr: "Çukurlarında"}
    caption:
      en: >-
        The ground has risen several metres, partly with spoil from building
        the mosque, so the three monuments stand in pits; the Serpent
        Column's heads broke off in 1700.
      tr: >-
        Zemin, kısmen caminin inşasından çıkan molozla birkaç metre
        yükseldi; bu yüzden üç anıt çukurlarda duruyor. Yılanlı Sütun'un
        başları 1700'de kırıldı.
  - id: mosque
    parts: [mosque-*, minarets]
    seconds: 3.0
    epochs: [2026]
    sources: [tdv-sultan-ahmed-camii, bit-cetinkaya-bizans-mimarisi, janin-1950]
    label: {en: "The Sultan Ahmed Mosque", tr: "Sultan Ahmed Camii"}
    caption:
      en: >-
        Sedefkâr Mehmed Ağa's mosque for Ahmed I (1609–1617) rose on the east
        side, where the kathisma is thought to have stood, laid out with the
        square's monuments in mind.
      tr: >-
        Sedefkâr Mehmed Ağa'nın I. Ahmed için yaptığı cami (1609–1617),
        meydanın anıtları gözetilerek doğu yanda, kathismanın durduğu
        düşünülen yerde yükseldi.
  - id: fountain
    parts: [fountain, fountain-dome]
    seconds: 2.8
    epochs: [2026]
    sources: [tdv-alman-cesmesi, byzleg-hippodrome]
    label: {en: "The German Fountain", tr: "Alman Çeşmesi"}
    caption:
      en: >-
        The German Fountain, Wilhelm II's gift of 1900–1901, stands about
        where the starting gates were.
      tr: >-
        II. Wilhelm'in 1900–1901'deki armağanı Alman Çeşmesi, aşağı yukarı
        başlangıç kapılarının yerinde duruyor.
