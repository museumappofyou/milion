# P13 kit spec: the Hippodrome of Constantinople, Milestone XII, the
# Hippodrome through time (TM). Frame: metres, z up, the Byzantine track at
# z = 0, the Serpent Column (OSM node 415157636) on the origin, +y along the
# spina toward the starting gates (north-north-east), +x to its right.
# Placed from OpenStreetMap: the axis through the two obelisks (ways
# 1120852417 and 1120852418), the sphendone's outer wall (way 321386212,
# about 118 m across, its apex 228 m south of the column), and the outlines
# of the İbrahim Paşa Palace and the Sultan Ahmed Mosque from the Atlas's
# building data.
# Cited and checked: about 429 m long and 119 m wide, the spina about 2 m
# wide (Turkish Archaeological News); the Theodosian obelisk's shaft about
# 19.6 m; the Walled Obelisk about 32 m. Not taken from any source and set in
# proportion, so no caption states them: the stands (drawn as 15 steps, each
# two rows, 15 m high), the kathisma, the carceres and its twelve gates, the
# spina's height (3.5 m, within the 3–4 m given), the turning posts, the
# obelisk's bases, the sphendone's vaults (25 arches, as Casson counted), the
# depth of today's pits (sources say 2 to 5 m; drawn 2.5 m) and the later
# buildings, drawn as masses. The quadriga is four blocks, a sign.
schemaVersion: 1
id: hippodrome
place: hippodrome
title: {en: "The Hippodrome through time", tr: "Zaman içinde Hipodrom"}
description:
  en: >-
    The Hippodrome as a drawing through four moments: Constantine's
    racecourse of 330, with its stands, starting gates, imperial box and
    central barrier; the same before the sack of 1204, with Theodosius's
    obelisk and the Walled Obelisk; At Meydanı in 1582, the stands gone and
    İbrahim Paşa's palace on their vaults; and Sultanahmet Square today. A
    diagram on cited dimensions and OpenStreetMap, not a survey.
  tr: >-
    Dört anda bir çizim olarak Hipodrom: Konstantin'in 330'daki tribünleri,
    başlangıç kapıları, imparator locası ve orta setiyle at yarışı alanı;
    1204 yağmasından önce, Theodosius'un dikilitaşı ve Örme Dikilitaş ile
    aynı yer; tribünleri gitmiş, İbrahim Paşa Sarayı onların tonozları
    üstünde yükselmiş 1582 Atmeydanı; ve bugünkü Sultanahmet Meydanı. Kaynaklı
    ölçülere ve OpenStreetMap'e dayanan bir şemadır, rölöve değildir.
eras: [byzantine, ottoman, modern]
honesty: RECONSTRUCTION
orientation:
  axis: 38.97
  source: osm-hippodrome-2026-11-19
  line:   # [lat, lon], centroids of the Walled Obelisk's and the Theodosian obelisk's OSM outlines
    - [41.0054052, 28.9748422]
    - [41.0059276, 28.9754001]
step: 12.0
nightLamps: [[0, 0, 28], [0, 90, 28], [0, -90, 28], [145, 60, 28]]
epochs:
  - {year: 330, label: {en: "Constantine's Hippodrome, 330", tr: "Konstantin'in Hipodromu, 330"}}
  - {year: 1200, label: {en: "Before the sack of 1204", tr: "1204 yağmasından önce"}}
  - {year: 1582, label: {en: "At Meydanı, 1582", tr: "Atmeydanı, 1582"}}
  - {year: 2026, label: {en: "Sultanahmet Square today", tr: "Bugün Sultanahmet Meydanı"}}
