  - id: floor-to-floor
    value: 7.5
    measure: {kind: bottom, parts: [lower-wall-*]}
    source: talbot-rice-1933
    quote: "3.5 metres above the floor of the lower church or nearly 4 metres below that of the upper"
  - id: dome-diameter
    value: 3.3
    measure: {kind: diameter, parts: [dome], side: inner, band: 0.02}
    source: ousterhout-master-builders
    quote: "The Myrelaion's dome is only about 3.3 meters in diameter, or just about ten Byzantine feet"
  - id: drum-diameter
    value: 5.5
    measure: {kind: diameter, parts: [dome-drum], side: outer, band: 0.02}
    source: freely-cakmak-2004
    quote: "the dome sits on a high cylindrical drum, 5.50 meters in diameter and rising to a height of 3.15 meters"
  - id: drum-height
    value: 3.15
    measure: {kind: extent, parts: [dome-drum], axis: z}
    source: freely-cakmak-2004
    quote: "rising to a height of 3.15 meters"
  - id: drum-windows
    value: 8
    measure: {kind: count, parts: [dome-drum], zmin: 9.3, zmax: 11.1}
    source: freely-cakmak-2004
    quote: "penetrated by eight round-headed windows separated by triangular projecting buttresses"
  - id: length-with-apses
    value: 17.16
    measure: {kind: extent, parts: [wall-*, apse, side-apses], axis: y}
    source: osm-way-198768798
    quote: "OSM outline, minimum-area rectangle 17.16 × 11.30 m"
  - id: width-across-buttresses
    value: 11.30
    measure: {kind: extent, parts: [wall-*, buttresses], axis: x}
    source: osm-way-198768798
    quote: "OSM outline, minimum-area rectangle 17.16 × 11.30 m"
shared: [choisy-1883]
sources:
