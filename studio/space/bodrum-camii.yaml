# P09 kit spec: the Myrelaion church (Bodrum Camii), Laleli, c. 920.
# Frame: metres, z up, the upper church floor at z = 0, +y along the
# west–east axis toward the apse (+x is then south). Cited dimensions are
# checked against the geometry (tool/space/build_kit.py). Values that no
# source gives are set in proportion and say so: wall thickness 0.75 m and the
# buttresses are chosen so the outline matches OSM's; the heights follow the
# rule that a cross-in-square church is about as high to its cross-arm vaults
# as its naos is wide (Buchwald, quoted by Ousterhout).
schemaVersion: 1
id: bodrum-camii
place: bodrum-mosque
title: {en: "The Myrelaion, a church on a church", tr: "Myrelaion: kilise üstünde kilise"}
description:
  en: >-
    A drawing of the Myrelaion (Bodrum Camii) assembling, seen from below: the
    lower church that lifts it to the level of Romanos I's palace, then a naos
    8 m square on four columns, its cross vaults and a dome 3.3 m across on a
    drum with eight windows. The time scrubber turns the church of about 920
    into today's mosque. Plan dimensions are cited; heights follow a proportion
    rule. A diagram, not a survey.
  tr: >-
    Myrelaion'un (Bodrum Camii) aşağıdan görülen çizimi kendini kurar: onu I.
    Romanos'un sarayıyla aynı seviyeye çıkaran alt kilise, ardından dört sütun
    üstünde 8 m'lik kare naos, haç kolu tonozları ve sekiz pencereli kasnağın
    üstünde 3,3 m çapında bir kubbe. Zaman çubuğu yaklaşık 920'deki kiliseyi
    bugünkü camiye çevirir. Plan ölçüleri kaynaklıdır; yükseklikler bir oran
    kuralına dayanır. Bu bir şemadır, rölöve değildir.
eras: [byzantine, ottoman]
honesty: RECONSTRUCTION
orientation:
  axis: 95.3
  source: osm-way-198768798
  footprint:   # [lat, lon], OSM way 198768798 v6 (2023-02-15)
    - [41.0085532, 28.9556120]
    - [41.0085389, 28.9558149]
    - [41.0084692, 28.9558063]
    - [41.0084490, 28.9558038]
    - [41.0084508, 28.9557795]
    - [41.0084634, 28.9557811]
    - [41.0084664, 28.9557389]
    - [41.0084423, 28.9557359]
    - [41.0084468, 28.9556714]
    - [41.0084519, 28.9555994]
    - [41.0084816, 28.9556031]
step: 1.6
epochs:
  - {year: 922, label: {en: "Myrelaion church, c. 920", tr: "Myrelaion Kilisesi, y. 920"}}
  - {year: 2026, label: {en: "Bodrum Camii today", tr: "Bugün Bodrum Camii"}}
