  - id: lower-hall-length
    value: 10.65
    measure: {kind: gap, from: [lower-wall-x], to: [lower-wall-e], axis: y}
    source: freely-cakmak-2004
    quote: "a rectangular hall 8 by 10.65 meters in plan"
  - id: lower-narthex-width
    value: 2.65
    measure: {kind: gap, from: [lower-wall-w], to: [lower-wall-x], axis: y}
    source: freely-cakmak-2004
