steps:
  - id: substructure
    parts: [lower-wall-*, lower-spur, lower-apse, lower-buttresses]
    seconds: 3.4
    epochs: []
    sources: [freely-cakmak-2004, naumann-1966]
    label: {en: "A platform for a palace church", tr: "Saray kilisesi için bir set"}
    caption:
      en: >-
        The ground falls toward the Marmara, so the church first got a storey
        under it: a substructure that lifts its floor to the level of Romanos
        I's palace terrace.
      tr: >-
        Arazi Marmara'ya doğru alçalır; bu yüzden kilisenin önce altına bir kat
        yapıldı: döşemesini I. Romanos'un saray terasıyla aynı seviyeye
        kaldıran bir alt yapı.
  - id: lower-church
    parts: [lower-columns, lower-vaults, lower-aisle-vaults, lower-narthex-vault, floor]
    seconds: 3.4
    epochs: []
    sources: [freely-cakmak-2004, talbot-rice-1933]
    label: {en: "The lower church", tr: "Alt kilise"}
    caption:
      en: >-
        Inside it, a hall 8 by 10.65 m in three aisles: four columns stand
        directly under the church's own, and its vaults carry the floor 7.5 m
        above.
      tr: >-
        İçinde üç sahınlı, 8'e 10,65 m'lik bir salon: dört sütun üstteki
        kilisenin sütunlarının tam altında durur, tonozları 7,5 m yukarıdaki
        döşemeyi taşır.
  - id: walls
    parts: [wall-*, buttresses]
    seconds: 3.2
    epochs: []
    sources: [van-millingen-1912, freely-cakmak-2004]
    label: {en: "Walls and half-round buttresses", tr: "Duvarlar ve yarım yuvarlak payandalar"}
    caption:
      en: >-
        All brick: a naos 8 m square behind a narthex, its long sides ribbed
        with six half-round buttresses each, two more flanking the west door.
      tr: >-
        Tamamı tuğla: bir son cemaat yerinin arkasında 8 m'lik kare naos; uzun
        kenarlarında altışar, batı kapısının iki yanında birer yarım yuvarlak
        payanda.
  - id: apses
    parts: [apse*, side-apses*]
    seconds: 3.2
    epochs: []
    sources: [van-millingen-1912, freely-cakmak-2004]
    label: {en: "Three apses", tr: "Üç apsis"}
    caption:
      en: >-
        Three apses close the east end, each three-sided outside; the main one
        is round within.
      tr: >-
        Doğu ucunu üç apsis kapatır; üçü de dışta üç yüzlüdür, ortadaki içte
        yuvarlaktır.
  - id: columns
    parts: [columns]
    seconds: 3.2
    epochs: [922]
    sources: [freely-cakmak-2004]
    label: {en: "Four columns", tr: "Dört sütun"}
    caption:
      en: >-
        Four columns mark a cross with arms 4 m wide, dividing the naos into
        nine bays: the cross-in-square plan.
      tr: >-
        Dört sütun kolları 4 m genişliğinde bir haç çizer ve naosu dokuz
        bölüme ayırır: kapalı Yunan haçı planı.
  - id: vaults
    parts: [vault-*]
    seconds: 3.2
    epochs: []
    sources: [freely-cakmak-2004, ousterhout-master-builders]
    label: {en: "Cross vaults", tr: "Haç kolu tonozları"}
    caption:
      en: >-
        Barrel vaults roof the four arms, small domical vaults the corners. The
        drawing raises them about as high as the naos is wide, a proportion
        found in this church.
      tr: >-
        Dört kolu beşik tonozlar, köşeleri küçük kubbemsi tonozlar örter. Çizim
        onları naosun genişliği kadar yükseğe koyar; bu oran bu kilisede
        gözlenmiştir.
  - id: pendentives
    parts: [pendentives, ring]
    seconds: 3.2
    epochs: []
    sources: [choisy-1883]
    label: {en: "Pendentives", tr: "Pandantifler"}
    caption:
      en: >-
        Over the 4 m crossing, four pendentives turn the square into the ring
        the drum stands on.
      tr: >-
        4 m'lik orta bölümün üstünde dört pandantif kareyi kasnağın oturduğu
        bileziğe çevirir.
  - id: drum
    parts: [dome-drum]
    seconds: 3.2
    epochs: []
    sources: [freely-cakmak-2004]
    label: {en: "A drum with eight windows", tr: "Sekiz pencereli kasnak"}
    caption:
      en: >-
        A cylindrical drum 5.5 m across and 3.15 m high, its eight round-headed
        windows separated by triangular buttresses.
      tr: >-
        5,5 m çapında, 3,15 m yüksekliğinde silindirik bir kasnak; sekiz
        yuvarlak kemerli penceresini üçgen payandalar ayırır.
  - id: dome
    parts: [dome]
    seconds: 3.2
    epochs: []
    sources: [ousterhout-master-builders, freely-cakmak-2004]
    label: {en: "A dome 3.3 m across", tr: "3,3 m'lik kubbe"}
    caption:
      en: >-
        The dome is only about 3.3 m in diameter, about ten Byzantine feet,
        divided inside into eight concave cells.
      tr: >-
        Kubbenin çapı yalnızca 3,3 m kadardır, yaklaşık on Bizans ayağı; içten
        sekiz iç bükey dilime ayrılır.
  - id: piers
    parts: [piers]
    seconds: 3.2
    epochs: [2026]
    sources: [freely-cakmak-2004, talbot-rice-1933]
    label: {en: "Piers for columns", tr: "Sütunların yerine ayaklar"}
    caption:
      en: >-
        At some unrecorded date after the Ottoman conversion (about 1500), the
        four columns were replaced by the masonry piers that carry the dome
        today.
      tr: >-
        Osmanlı döneminde camiye çevrilmesinden (y. 1500) sonra, tarihi
        bilinmeyen bir zamanda, dört sütunun yerini bugün kubbeyi taşıyan kâgir
        ayaklar aldı.
  - id: minaret
    parts: [minaret*]
    seconds: 3.2
    epochs: [2026]
    sources: [freely-cakmak-2004, naumann-1966]
    label: {en: "The minaret", tr: "Minare"}
    caption:
      en: >-
        The minaret stands on the south-west corner of the lower church and
        projects beyond it on two sides; its height here is an estimate.
      tr: >-
        Minare alt kilisenin güneybatı köşesinde durur ve iki yönde onun
        dışına taşar; buradaki yüksekliği bir tahmindir.
reveal:
  through: dome
  seconds: 8.0
  turnDegrees: 30
  caption:
    en: "A church lifted onto its own lower church, then a dome only 3.3 m across."
    tr: "Kendi alt kilisesinin üstüne kaldırılmış bir kilise, sonra yalnızca 3,3 m'lik bir kubbe."
choisy: {sectionHeight: 13.0, elevation: -50, azimuth: 225}
