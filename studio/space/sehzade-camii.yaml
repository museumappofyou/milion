# P09 kit spec: the Şehzade Mosque (Şehzade Camii), Sinan, 1543–1548.
# Frame: metres, z up, the prayer-hall floor at z = 0, the hall centred on
# the origin, +y along the qibla axis (courtyard → mihrab), +x to its right.
# Cited dimensions are checked against the geometry. Not found in any source
# and set in proportion: the semi-domes' radius (taken as the dome's, which
# they meet at the main arches), the exedrae, corner domes and weight towers'
# sizes, the window rows and the minarets' şerefe heights. The minaret height
# is disputed (55 m on Wikipedia, unsourced; 41.1 m in Artar 2006 citing
# Akşit 1981); the drawing uses about 55 m and no caption states it.
schemaVersion: 1
id: sehzade-camii
place: sehzade
title: {en: "The Şehzade: four half-domes", tr: "Şehzade: dört yarım kubbe"}
description:
  en: >-
    A drawing of the Şehzade Mosque assembling, seen from below: a hall 38 m
    square inside on four piers, a dome 19 m across with its crown 37 m up,
    four half-domes skirted by eight exedrae, four corner domes, then the
    courtyard of sixteen domes on twelve columns and the two minarets. Sinan
    finished it in 1548. A diagram on cited dimensions, not a survey.
  tr: >-
    Şehzade Camii'nin aşağıdan görülen çizimi kendini kurar: dört ayak
    üstünde içten 38 m'lik kare bir harim, 19 m çapında, tepesi 37 m'de bir
    kubbe, sekiz eksedrayla eteklenen dört yarım kubbe, dört köşe kubbesi;
    ardından on iki sütun üstünde on altı kubbeli avlu ve iki minare. Sinan
    onu 1548'de bitirdi. Kaynaklı ölçülere dayanan bir şemadır, rölöve
    değildir.
eras: [ottoman]
honesty: RECONSTRUCTION
orientation:
  axis: 137.4
  source: osm-relation-7656706
  footprint:   # [lat, lon], outer way 24234641 of OSM relation 7656706
    - [41.0140313, 28.9565445]
    - [41.0134684, 28.9572127]
    - [41.0137686, 28.9576211]
    - [41.0141296, 28.9571765]
    - [41.0142959, 28.9569647]
step: 4.0
epochs:
  - {year: 1548, label: {en: "Şehzade Mosque, 1548", tr: "Şehzade Camii, 1548"}}
  - {year: 1640, label: {en: "Murad IV's şadırvan, by 1640", tr: "IV. Murad'ın şadırvanı, 1640'a dek"}}
