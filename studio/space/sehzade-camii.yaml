steps:
  - id: walls
    parts: [wall-*, buttresses]
    seconds: 3.4
    epochs: []
    sources: [archnet-sehzade, artar-2006, kuran-1986]
    label: {en: "A square 42 m wide", tr: "42 m'lik bir kare"}
    caption:
      en: >-
        The hall is a square 42 m wide outside and 38 m inside; buttresses
        split each wall into five bays.
      tr: >-
        Harim dıştan 42, içten 38 m'lik bir karedir; payandalar her duvarı beş
        bölüme ayırır.
  - id: piers
    parts: [piers-*]
    seconds: 3.2
    epochs: []
    sources: [archnet-sehzade, artar-2006]
    label: {en: "Four piers", tr: "Dört ayak"}
    caption:
      en: >-
        Four piers close to five metres square, 16 m tall, stand at the corners
        of the middle nine of a five-by-five grid.
      tr: >-
        Beşe beş bir ızgaranın ortadaki dokuz gözünün köşelerinde, beş metreye
        yakın kare kesitli, 16 m yüksekliğinde dört ayak durur.
  - id: arches
    parts: [arches]
    seconds: 3.0
    epochs: []
    sources: [artar-2006]
    label: {en: "Four great arches", tr: "Dört büyük kemer"}
    caption:
      en: "Four pointed arches rise 10.8 m from the piers."
      tr: "Ayaklardan dört sivri kemer 10,8 m yükselir."
  - id: pendentives
    parts: [pendentives]
    seconds: 3.0
    epochs: []
    sources: [britannica-pendentive]
    label: {en: "Pendentives", tr: "Pandantifler"}
    caption:
      en: "Four pendentives turn the square between the arches into a circle 19 m across."
      tr: "Dört pandantif kemerlerin arasındaki kareyi 19 m çapında bir daireye çevirir."
  - id: dome
    parts: [dome, dome-windows]
    seconds: 3.6
    epochs: []
    sources: [archnet-sehzade, artar-2006, wp-sehzade-1367352917]
    label: {en: "A dome 19 m across", tr: "19 m'lik kubbe"}
    caption:
      en: >-
        The dome is 19 m across, its crown 37 m above the floor, with 24
        windows round its base.
      tr: >-
        Kubbenin çapı 19 m, tepesi döşemeden 37 m yüksektedir; eteğinde 24
        pencere vardır.
  - id: semidomes
    parts: [semidomes, semidomes-windows, exedrae, exedrae-cap]
    seconds: 3.6
    epochs: []
    sources: [kuran-1986, artar-2006, wp-sehzade-1367352917]
    label: {en: "Four half-domes", tr: "Dört yarım kubbe"}
    caption:
      en: >-
        Four half-domes, each skirted by two exedrae with three windows, carry
        the thrust down on every side: the plan Hagia Sophia used on two sides,
        here on all four.
      tr: >-
        Her biri üç pencereli ikişer eksedrayla eteklenen dört yarım kubbe,
        itkiyi her yönden aşağı indirir: Ayasofya'nın iki yanda kullandığı
        düzen burada dört yanda.
  - id: corners
    parts: [corner-*, weight-towers*]
    seconds: 3.0
    epochs: []
    sources: [kuran-1986, ercag-1991]
    label: {en: "Corner domes and weight towers", tr: "Köşe kubbeleri ve ağırlık kuleleri"}
    caption:
      en: >-
        Small domes cover the four corners, and the piers rise through the roof
        as weight towers that press down on them.
      tr: >-
        Dört köşeyi küçük kubbeler örter; ayaklar çatıyı aşıp onları aşağı
        bastıran ağırlık kuleleri olarak yükselir.
  - id: galleries
    parts: [gallery-*]
    seconds: 3.0
    epochs: []
    sources: [kuran-1986, ercag-1991]
    label: {en: "Side galleries", tr: "Yan galeriler"}
    caption:
      en: >-
        Single-storey galleries, five bays long and about 3 m deep, run along
        both sides and hide the buttresses.
      tr: >-
        Beş gözlü, 3 m kadar derinlikte tek katlı galeriler iki yan boyunca
        uzanır ve payandaları gizler.
  - id: courtyard
    parts: [court, court-walls, court-arches, court-domes]
    seconds: 3.4
    epochs: []
    sources: [archnet-sehzade, artar-2006, kuran-1986]
    label: {en: "The courtyard", tr: "Avlu"}
    caption:
      en: >-
        The courtyard is as large as the hall: sixteen domes on twelve
        columns round an open square.
      tr: >-
        Avlu harim kadar büyüktür: açık bir karenin çevresinde on iki sütun
        üstünde on altı kubbe.
  - id: minarets
    parts: [minarets*]
    seconds: 3.4
    epochs: []
    sources: [kuran-1986, ercag-1991, britannica-sinan]
    label: {en: "Two minarets", tr: "İki minare"}
    caption:
      en: >-
        Two minarets with two balconies each, their twelve-sided shafts carved
        in low relief, stand where courtyard and hall meet. Sinan called the
        mosque the work of his apprenticeship.
      tr: >-
        Avlu ile harimin birleştiği köşelerde, on iki köşeli gövdeleri
        alçak kabartmalarla bezeli, ikişer şerefeli iki minare yükselir. Sinan
        bu camiyi çıraklık eseri saydı.
  - id: sadirvan
    parts: [court-sadirvan*]
    seconds: 3.0
    epochs: [1640]
    sources: [tdv-sehzade-2010, archnet-sehzade]
    label: {en: "The şadırvan", tr: "Şadırvan"}
    caption:
      en: >-
        The octagonal şadırvan in the courtyard's middle is later: Murad IV
        (r. 1623–40) gave it, under a canopy on eight columns.
      tr: >-
        Avlunun ortasındaki sekizgen şadırvan sonradandır: onu IV. Murad
        (s. 1623–40) yaptırdı, sekiz sütunlu bir saçağın altında.
reveal:
  through: semidomes
  seconds: 8.0
  turnDegrees: 36
  caption:
    en: "A dome 19 m across, braced on all four sides by half-domes."
    tr: "19 m'lik bir kubbe, dört yandan yarım kubbelerle desteklenir."
choisy: {sectionHeight: 8.5, elevation: -50, azimuth: 225}
