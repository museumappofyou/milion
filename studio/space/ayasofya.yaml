# P12 kit spec: Hagia Sophia (Ayasofya), 532–537, its dome rebuilt 558–562.
# Milestone IX, "The dome that fell": Justinian's church with its first,
# flatter dome; the fall of 7 May 558; Isidore the Younger's higher dome of
# 562 with its ring of forty windows; the buttresses and minarets by the
# 1570s. Frame: metres, z up, the nave floor at z = 0, the dome's centre on
# the origin, +y along the axis toward the apse (east-south-east), +x to its
# right (south).
# Cited and checked against the geometry: the dome about 31 m across, its
# crown about 55.6 m above the floor, forty windows at its base, and the
# first dome 20 Byzantine feet (about 6.25 m) lower. Not taken from any
# source and set in proportion, so no caption states them: the piers'
# size, the arches' springing (24.5 m), the aisles, galleries and narthexes,
# the exedrae and apse, the buttress towers, the later buttresses' places and
# the minarets' heights. The first dome's profile is not known: it is drawn
# as the same dome flattened to the lower crown. A diagram on cited
# dimensions, not a survey.
schemaVersion: 1
id: ayasofya
place: hagia-sophia
title: {en: "The dome that fell", tr: "Çöken kubbe"}
description:
  en: >-
    Hagia Sophia as a drawing: Justinian's church of 537 under its first
    dome, the fall of 7 May 558, and the higher dome Isidore the Younger
    finished in 562 on a ring of forty windows, which still stands; then the
    buttresses and minarets added by the 1570s. A diagram on cited
    dimensions, not a survey; the first dome's profile is not known.
  tr: >-
    Bir çizim olarak Ayasofya: Justinianus'un 537'deki kilisesi ilk
    kubbesinin altında, 7 Mayıs 558'deki çöküş ve Genç İsidoros'un 562'de
    kırk pencereli bir halkanın üstünde tamamladığı, bugün de ayakta duran
    daha yüksek kubbe; ardından 1570'lere dek eklenen payandalar ve
    minareler. Kaynaklı ölçülere dayanan bir şemadır, rölöve değildir; ilk
    kubbenin kesiti bilinmiyor.
eras: [byzantine, ottoman]
honesty: RECONSTRUCTION
