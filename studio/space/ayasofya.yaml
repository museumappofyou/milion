  - id: piers
    parts: [piers-*, buttress-towers, buttress-bridges]
    seconds: 2.8
    epochs: []
    sources: [procopius-buildings-1]
    label: {en: "Four piers", tr: "Dört ayak"}
    caption:
      en: >-
        Four piers of squared stone carry the dome; Procopius says their
        joints were bound with lead.
      tr: >-
        Kubbeyi kesme taştan dört ayak taşır; Prokopios derzlerine kurşun
        döküldüğünü yazar.
  - id: colonnades
    parts: [arcade-*, gallery-floors, tympana]
    seconds: 2.8
    epochs: []
    sources: [procopius-buildings-1]
    label: {en: "Colonnades and galleries", tr: "Sütun dizileri ve galeriler"}
    caption:
      en: >-
        Columns open the aisles below and the galleries above onto the
        nave; walls of windows fill the great arches north and south.
      tr: >-
        Sütunlar alttaki yan nefleri ve üstteki galerileri orta mekâna açar;
        kuzey ve güneyde büyük kemerleri pencereli duvarlar doldurur.
  - id: arches
    parts: [arches]
    seconds: 2.6
    epochs: []
    sources: [tdv-ayasofya, istanbultarihi-ayasofya]
    label: {en: "Four great arches", tr: "Dört büyük kemer"}
    caption:
      en: "Four great arches about 31 m wide rise from the piers."
      tr: "Ayaklardan yaklaşık 31 m genişliğinde dört büyük kemer yükselir."
  - id: pendentives
    parts: [pendentives]
    seconds: 2.6
    epochs: []
    sources: [britannica-pendentive]
    label: {en: "Pendentives", tr: "Pandantifler"}
    caption:
      en: "Four pendentives turn the square between the arches into a circle."
      tr: "Dört pandantif kemerlerin arasındaki kareyi bir daireye çevirir."
  - id: half-domes
    parts: [semidomes, semidomes-windows, exedrae, exedrae-cap, apse, apse-cap, roof-*]
    seconds: 3.0
    epochs: []
    sources: [procopius-buildings-1, tdv-ayasofya]
    label: {en: "Two half-domes", tr: "İki yarım kubbe"}
    caption:
      en: >-
        Half-domes east and west, each opening into smaller exedrae and, at
        the east, the apse, lengthen the space under the dome.
      tr: >-
        Doğuda ve batıda, küçük eksedralara ve doğuda apsise açılan yarım
        kubbeler, kubbenin altındaki mekânı uzatır.
  - id: dome-537-west
    parts: [dome-537-west, dome-537-west-windows]
    seconds: 3.0
    epochs: [537, 558]
    sources: [theophanes-1997, tdv-ayasofya]
    label: {en: "The first dome", tr: "İlk kubbe"}
    caption:
      en: >-
        The first dome was about 6 m lower than today's. Its exact shape is
        not known; it is drawn here as today's dome, flattened.
      tr: >-
        İlk kubbe bugünkünden yaklaşık 6 m daha alçaktı. Biçimi tam olarak
        bilinmiyor; burada bugünkü kubbe basıklaştırılarak çizildi.
  - id: dome-537
    parts: [dome-537-east, dome-537-east-windows]
    seconds: 2.6
    epochs: [537]
    sources: [theophanes-1997]
    label: {en: "Its eastern half", tr: "Doğu yarısı"}
    caption:
      en: >-
        Its eastern half, over the sanctuary. This is the part the
        chroniclers say fell.
      tr: >-
        Doğu yarısı, kutsal alanın üstünde. Kronikçilere göre çöken kısım
        burası.
  - id: collapse
    parts: [debris]
    seconds: 4.2
    epochs: [558]
    sources: [theophanes-1997, agathias-mango-1972, tdv-ayasofya]
    label: {en: "7 May 558", tr: "7 Mayıs 558"}
    caption:
      en: >-
        Weakened by the earthquake of 14 December 557, part of the dome fell
        on 7 May 558: Theophanes says the eastern part, over the sanctuary,
        crushing the altar, the ciborium and the ambo.
      tr: >-
        14 Aralık 557 depremiyle zayıflayan kubbenin bir kısmı 7 Mayıs
        558'de çöktü: Theophanes'e göre kutsal alanın üstündeki doğu kısmı;
        altarı, ciboriumu ve ambonu ezdi.
  - id: dome-562
    parts: [dome-562, dome-562-windows]
    seconds: 3.4
    epochs: [562, 1573]
    sources: [theophanes-1997, agathias-mango-1972, tdv-ayasofya, byzantine-legacy-hagia-sophia]
    label: {en: "Twenty feet higher", tr: "Yirmi ayak daha yüksek"}
    caption:
      en: >-
        Isidore the Younger rebuilt the whole dome, steeper and twenty
        Byzantine feet higher, about 6.25 m; the church was consecrated again
        on 24 December 562. Its crown is about 55.6 m above the floor.
      tr: >-
        Genç İsidoros kubbenin tamamını daha dik ve yirmi Bizans ayağı,
        yaklaşık 6,25 m daha yüksek olarak yeniden kurdu; kilise 24 Aralık
        562'de yeniden kutsandı. Tepesi döşemeden yaklaşık 55,6 m yüksekte.
  - id: light
    parts: [dome-562-light]
    seconds: 3.2
    epochs: [562, 1573]
    sources: [procopius-buildings-1, byzantine-legacy-hagia-sophia]
    label: {en: "Forty windows", tr: "Kırk pencere"}
    caption:
      en: >-
        Forty windows ring its base. Procopius, writing of the first dome,
        said it seemed not to rest on masonry but to hang from heaven.
      tr: >-
        Eteğini kırk pencere çevreler. Prokopios ilk kubbe için onun duvara
        dayanmıyor, gökten asılı duruyormuş gibi göründüğünü yazmıştı.
  - id: buttresses
    parts: [buttresses]
    seconds: 2.8
    epochs: [1573]
    sources: [tdv-ayasofya, istanbultarihi-ayasofya]
    label: {en: "Buttresses", tr: "Payandalar"}
    caption:
      en: >-
        Buttresses were added over the centuries, among them under
        Andronikos II in 1317 and, for Selim II, by Sinan.
      tr: >-
        Yüzyıllar içinde payandalar eklendi; bunlar arasında II. Andronikos
        döneminde 1317'de ve II. Selim için Sinan'ın yaptıkları var.
  - id: minarets
    parts: [minarets-*]
    seconds: 3.0
    epochs: [1573]
    sources: [tdv-ayasofya, istanbultarihi-ayasofya]
    label: {en: "Four minarets", tr: "Dört minare"}
    caption:
      en: >-
        After 1453 the church became a mosque; by the end of the 16th century
        four minarets stood at its corners.
      tr: >-
        1453'ten sonra kilise camiye çevrildi; 16. yüzyılın sonunda
        köşelerinde dört minare yükseliyordu.
