# P09 kit spec: Sts Sergius and Bacchus (Küçük Ayasofya Camii), c. 527–536.
# Frame: metres, z up, the church floor at z = 0, the octagon's centre at the
# origin, +y along the west–east axis toward the apse (+x is then south).
# Cited dimensions are checked against the geometry; Van Millingen's feet
# are converted at 0.3048 m. The enclosure is irregular as Van Millingen and
# The Byzantine Legacy describe it: the south wall is about 2.5 m shorter
# than the north (the east wall runs askew) and twice as thick, and the
# octagon stands 3° askew in it. Not found in any text and set in proportion
# (Henderson's 1912 plates scaled by the researcher, or estimated): the wall
# thicknesses, the narthex and apse sizes, column heights, the bema vault,
# the window rows, the portico's height and the whole minaret.
schemaVersion: 1
id: kucuk-ayasofya
place: little-hagia-sophia
title: {en: "Sts Sergius and Bacchus: an octagon in a square", tr: "Sergios ve Bakhos: karenin içinde sekizgen"}
description:
  en: >-
    A drawing of Sts Sergius and Bacchus (Küçük Ayasofya) assembling, seen
    from below: an irregular enclosure 101 by 77½ feet, an octagon of eight
    piers askew inside it, two storeys of columns with exedrae on the
    diagonals, and a dome of sixteen compartments with no pendentives. The
    time scrubber adds the Ottoman portico and today's minaret. A diagram on
    cited dimensions, not a survey.
  tr: >-
    Sergios ve Bakhos'un (Küçük Ayasofya) aşağıdan görülen çizimi kendini
    kurar: 101'e 77½ ayaklık düzensiz bir dış duvar, içinde hafifçe yamuk
    duran sekiz ayaklı bir sekizgen, köşegenlerde eksedralarla iki kat
    sütun ve pandantifsiz, on altı dilimli bir kubbe. Zaman çubuğu Osmanlı
    revakını ve bugünkü minareyi ekler. Kaynaklı ölçülere dayanan bir
    şemadır, rölöve değildir.
eras: [byzantine, ottoman]
honesty: RECONSTRUCTION
