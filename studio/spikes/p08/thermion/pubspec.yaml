name: thermion_bench
description: "Milion P08 spike: thermion (Filament) self-measuring benchmark."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Pinned exactly: the spike measured this version only.
  thermion_flutter: 0.5.0
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bench-50k-color0.glb

# SPIKE ONLY: the unmodified thermion_dart 0.5.0 archive from pub.dev, used via
# a path so its hook's Filament cache (.dart_tool/thermion_dart/lib/...) can be
# pre-seeded locally. The hook's own download host (pub-*.r2.dev) is not
# reachable from this network (TLS handshake rejected). The cache was seeded
# with google/filament v1.69.1 release archives plus self-built imageio/png/
# tinyexr (see result.json "buildOk"). Delete this block wherever
# https://pub-c8b6266320924116aaddce03b5313c0a.r2.dev is reachable.
dependency_overrides:
  thermion_dart:
    path: ../thermion_dart_local
