description:
  en: >-
    A stretch of the floor mosaic laid round a courtyard of the Great Palace
    in the 6th or early 7th century: an eagle fighting a snake, a griffin, a
    hunter, goats and grazing gazelles or antelopes on a white ground.
  tr: >-
    6. yüzyılda ya da 7. yüzyılın başında Büyük Saray’ın bir avlusunun
    çevresine döşenmiş taban mozaiğinden bir bölüm: bir yılanla dövüşen
    kartal, bir grifon, bir avcı, keçiler ve beyaz zemin üstünde otlayan
    ceylanlar ya da antiloplar.
