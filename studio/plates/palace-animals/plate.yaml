# Milestone XV, Great Palace animals (P13): MM and DP on one photograph of the
# peristyle floor's centre-west stretch (Francesco Bini). The animals sway in
# short loops inside their masks (flow motion 'sway': the masks come from the
# segments below, each with a direction; tool/plate/stages/flowmask.py). The
# mosaic does not move, so every beat that moves reads IMAGINED.
