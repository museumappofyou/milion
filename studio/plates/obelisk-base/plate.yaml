# Milestone XIII, the Obelisk base (P13): an RL and candle plate of the base
# Theodosius I gave the obelisk he raised in 390. The master stacks three
# photographs by Francesco Bini (tool/content/fetch_commons.py, composite
# 'obelisk-base'): the south face's upper block, the emperor and his family
# in the box; the south face's plinth, the races; the north face's plinth,
# the obelisk hauled up. Janin's south and north are the south-west and
# north-east faces (the Hippodrome runs NE–SW).
id: obelisk-base
milestone: milestone-xiii
artwork: ic-obelisk-base
title: {en: The Obelisk base, tr: Dikilitaş’ın kaidesi}
description:
  en: >-
    The marble base of the obelisk Theodosius I raised in the Hippodrome in
    390: the emperor and his court in the imperial box on the upper block,
    the chariot races and the obelisk hauled upright on the plinth below.
    Three photographs, two faces.
  tr: >-
    I. Theodosius’un 390’da Hipodrom’a diktirdiği dikilitaşın mermer kaidesi:
    üst blokta imparator locasındaki imparator ve sarayı, alttaki altlıkta
    araba yarışları ve dikilitaşın ayağa kaldırılışı. Üç fotoğraf, iki yüz.
