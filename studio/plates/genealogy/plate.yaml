artwork: M13
title: {en: The Genealogy dome, tr: Soy kütüğü kubbesi}
description:
  en: >-
    The southern dome of the inner narthex, seen from below. Christ fills the
    crown medallion; Adam and the ancestors stand in the 24 flutes around him,
    with nine windows in the lower ring.
  tr: >-
    İç narteksin güney kubbesi, aşağıdan. Tepedeki madalyonda İsa var; Âdem
    ve atalar çevresindeki 24 dilimde duruyor, alt sırada dokuz pencere
    açılıyor.
