title: {en: The Last Judgment, tr: Son Yargı}
description:
  en: >-
    Fresco in the vault of the parekklesion, about 1321. Christ the Judge sits
    between the Virgin and John the Baptist, with the apostles on benches at
    either side; above, an angel rolls up the heavens like a scroll, and a
    river of fire pours from before his feet.
  tr: >-
    Parekklesion tonozundaki fresk, 1321 dolayları. Yargıç İsa, Meryem ile
    Vaftizci Yahya’nın arasında oturuyor; havariler iki yandaki sıralarda.
    Yukarıda bir melek gökleri bir tomar gibi dürüyor; ayaklarının önünden
    bir ateş ırmağı akıyor.
