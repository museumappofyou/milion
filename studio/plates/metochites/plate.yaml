title: {en: Metochites offers Chora, tr: Metokhites Kariye’yi sunuyor}
description:
  en: >-
    Mosaic lunette over the door from the inner narthex into the naos, about
    1315–1321. Christ sits enthroned with a closed Gospel; at left Theodore
    Metochites, in a broad white hat, kneels and offers him a model of the
    church.
  tr: >-
    İç narteksten naosa açılan kapının üstündeki mozaik lünet, 1315–1321
    dolayları. İsa elinde kapalı bir İncil’le tahtta oturuyor; solda geniş
    beyaz şapkalı Theodoros Metokhites diz çökmüş, ona kilisenin maketini
    sunuyor.
