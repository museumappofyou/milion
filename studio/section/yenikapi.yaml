reveal:
  seconds: 10
  from: 1.6
  to: -3.4
  caption:
    en: "Digging for a metro station in 2004 found a Byzantine harbour and 37 ships."
    tr: "2004'te bir metro istasyonu için yapılan kazı, bir Bizans limanı ve 37 gemi buldu."
beats:
  - id: dig
    depth: 1.2
    seconds: 6
    label: {en: "A station, 2004", tr: "Bir istasyon, 2004"}
    caption:
      en: >-
        The Istanbul Archaeological Museums began a rescue dig here in 2004,
        ahead of the Marmaray tunnel and the metro: some 58,000 m², dug until
        2014. The station opened in 2013.
      tr: >-
        İstanbul Arkeoloji Müzeleri 2004'te, Marmaray tüneli ve metrodan önce
        burada bir kurtarma kazısı başlattı: yaklaşık 58.000 m², 2014'e dek
        kazıldı. İstasyon 2013'te açıldı.
    lift: []
    sources: [kiziltan-2014, hdn-yenikapi-2013, dailysabah-yenikapi-2014]
  - id: fill
    depth: -0.2
    seconds: 5
    label: {en: "Ottoman fill", tr: "Osmanlı dolgusu"}
    caption:
      en: >-
        Under Mustafa III the silted harbour was filled with rubble from
        building the Laleli Mosque, in the 1760s, and sold; it stayed market
        gardens into the 20th century.
      tr: >-
        III. Mustafa döneminde dolmuş liman, 1760'larda Laleli Camii'nin
        yapımından çıkan molozla dolduruldu ve satıldı; XX. yüzyıla dek
        bostan olarak kaldı.
    lift: []
    sources: [kiziltan-2014]
  - id: harbour
    depth: -2.4
    seconds: 6
    label: {en: "The Theodosian Harbour", tr: "Theodosius Limanı"}
    caption:
      en: >-
        Under Theodosius I, late in the 4th century, a mole closed the bay at
        the mouth of the Lykos. The stream's silt filled it from the west; by
        the late 12th century it was nearly full.
      tr: >-
        I. Theodosius döneminde, IV. yüzyılın sonlarında, Lykos'un
        ağzındaki koy bir mendirekle kapatıldı. Derenin getirdiği balçık
        limanı batıdan doldurdu; XII. yüzyılın sonunda neredeyse dolmuştu.
    lift: [wood-rope]
    sources: [kiziltan-2014, pulak-ingram-jones-2015]
  - id: ships
    depth: -4.2
    seconds: 7
    label: {en: "37 ships", tr: "37 gemi"}
    caption:
      en: >-
        37 wrecks of the 5th to early 11th centuries, the largest group of
        medieval ships ever dug up. Six are galleys, the first of their age
        found. Many sank in storms; a large group went down around AD 1000.
      tr: >-
        V. yüzyıldan XI. yüzyıl başına 37 batık: bugüne dek kazılmış en büyük
        Orta Çağ gemi topluluğu. Altısı kadırga; çağlarının bulunan ilk
        kadırgaları. Çoğu fırtınada battı; büyük bir grup MS 1000
        dolaylarında birlikte battı.
    lift: [ships]
    sources: [pulak-ingram-jones-2015, kiziltan-2014]
  - id: neolithic
    depth: -7.0
    seconds: 6
    label: {en: "A Neolithic village", tr: "Neolitik bir köy"}
    caption:
      en: >-
        Below the harbour floor, a village of the Fikirtepe culture, begun
        about 6500 BC, when the Marmara was still a lake. Its cremation urns
        are the earliest known in Anatolia.
      tr: >-
        Liman tabanının altında, Marmara henüz bir gölken, MÖ 6500
        dolaylarında kurulmuş bir Fikirtepe kültürü köyü. Yakma gömü
        küpleri Anadolu'da bilinen en eskileridir.
    lift: [grave-family, urns, grave-timbers]
    sources: [kiziltan-2014, yilmaz-2011-tubaar]
  - id: footprints
    depth: -8.3
    seconds: 6
    label: {en: "Footprints, −8.15 m", tr: "Ayak izleri, −8,15 m"}
    caption:
      en: >-
        On an old stream bed, 2,080 footprints were pressed into wet clay and
        sealed by sand, about 8,000 years ago. Most were made by people
        wearing shoes.
      tr: >-
        Eski bir dere yatağında, yaklaşık 8.000 yıl önce ıslak kile basılmış
        ve kumla örtülmüş 2.080 ayak izi bulundu. Çoğu ayakkabılı insanların
        izleri.
    lift: [footprints, huts, trees]
    sources: [kiziltan-2014, hdn-yenikapi-2013]
stills: [dig, fill, harbour, ships, neolithic, footprints]
