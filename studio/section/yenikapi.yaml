# P14 section spec: the harbour under the metro, Milestone XVII (PU, SB).
# Built by `python3.11 tool/section/build_section.py` into
# assets/section/yenikapi/section.json.
# A drawn section through the Yenikapı rescue excavation (2004–2014), from
# today's station down to the Neolithic footprints. Depths are metres
# relative to today's sea level (kot), as Kızıltan (2014) gives them; the
# street's height above the sea and the horizontal axis are not measured
# here: the drawing runs west to east across the harbour, not to scale, and
# the ships stand where the drawing has room, not where they were found.
schemaVersion: 1
id: yenikapi
place: yenikapi
milestone: milestone-xvii
honesty: RECONSTRUCTION
top: {value: 2.5, estimated: true, note: "the street above the sea, set in proportion"}
bottom: -9.6
title: {en: "The harbour under the metro", tr: "Metronun altındaki liman"}
description:
  en: >-
    A drawn section through the Yenikapı excavation: under the station, the
    Ottoman fill, the Theodosian Harbour with its 37 shipwrecks, and below
    them a Neolithic village and its footprints. Depths to scale; across,
    not to scale, and the ships are placed for legibility, not as found.
  tr: >-
    Yenikapı kazısından çizilmiş bir kesit: istasyonun altında Osmanlı
    dolgusu, 37 batığıyla Theodosius Limanı ve onların altında bir Neolitik
    köy ve ayak izleri. Derinlikler ölçekli; yatayda ölçek yok, gemiler
    bulundukları yere değil, okunacak biçimde yerleştirildi.
talkback:
  en: >-
    A vertical section, read from the top down. At the top, Yenikapı station.
    Under it Ottoman fill, then the sand and silt of the Theodosian Harbour
    from about 1 m below sea level, with 37 ship hulls; the harbour floor at
    about 6.4 m below sea level; under that the clay of a Neolithic village,
    with graves, huts and, at 8.15 m, footprints. The ships are listed in the
    Ships panel with their type where it is known.
  tr: >-
    Yukarıdan aşağı okunan dikey bir kesit. En üstte Yenikapı istasyonu.
    Altında Osmanlı dolgusu, sonra deniz seviyesinin yaklaşık 1 m altından
    başlayan Theodosius Limanı'nın kumu ve balçığı, 37 gemi teknesiyle;
    deniz seviyesinin yaklaşık 6,4 m altında liman tabanı; onun altında
    mezarları, kulübeleri ve 8,15 m'de ayak izleriyle bir Neolitik köyün
    kili. Gemiler, türü biliniyorsa türüyle, Gemiler panelinde listelenir.
sources: [kiziltan-2014, pulak-ingram-jones-2015, kocabas-2015, wp-yenikapi-1357055213]
